name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    # Opt into Node.js 24 for all actions — avoids the Node.js 20 deprecation
    # warning and prepares for the forced cutover on June 16th 2026.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle-wrapper.jar is not committed to the repo.
      # The system Gradle (>= 8.11 is guaranteed by setup-gradle) generates it.
      # Once you commit the jar (`git add gradle/wrapper/gradle-wrapper.jar`),
      # this step becomes a no-op and can be removed.
      - name: Generate gradle-wrapper.jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found — generating with system Gradle"
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            echo "gradle-wrapper.jar present — skipping generation"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
