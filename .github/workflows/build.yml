name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle/actions/setup-gradle@v4 replaces the manual cache + wrapper-jar
      # bootstrap. It:
      #   • Caches ~/.gradle/caches and ~/.gradle/wrapper automatically
      #   • Bootstraps gradle-wrapper.jar if it is missing from the repo
      #     (fixes: "Unable to access jarfile gradle-wrapper.jar")
      #   • Runs on Node.js 24 — no Node 20 deprecation warning
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
