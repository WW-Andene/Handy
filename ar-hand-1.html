<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Hand 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #0a0a0f;
    --plasma: #00ffe5;
    --plasma-dim: rgba(0,255,229,0.15);
    --warn: #ff4060;
    --bone: rgba(180,220,255,0.85);
    --ui-bg: rgba(8,8,16,0.75);
    --font: 'JetBrains Mono', 'Fira Mono', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: var(--font);
    color: var(--plasma);
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
  }

  /* Camera video — hidden, used as texture source */
  #cam {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    width: 1px; height: 1px;
  }

  /* WebGL canvas fills screen */
  #gl {
    position: fixed;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
  }

  /* HUD overlay */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  #status {
    position: absolute;
    top: 16px; left: 16px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--plasma);
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.25);
    border-radius: 4px;
    padding: 6px 10px;
    backdrop-filter: blur(8px);
  }

  #status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--warn);
    margin-right: 6px;
    vertical-align: middle;
    transition: background 0.3s;
  }
  #status.active .dot { background: var(--plasma); }
  #status.active { border-color: rgba(0,255,229,0.5); }

  #info {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(0,255,229,0.4);
    white-space: nowrap;
  }

  #fps-counter {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(0,255,229,0.5);
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.1);
    border-radius: 4px;
    padding: 4px 8px;
  }

  #hands-count {
    position: absolute;
    top: 52px; right: 16px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(0,255,229,0.5);
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.1);
    border-radius: 4px;
    padding: 4px 8px;
  }

  /* Startup overlay */
  #splash {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: opacity 0.6s;
  }

  #splash h1 {
    font-size: clamp(22px, 6vw, 36px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--plasma);
    text-shadow: 0 0 30px rgba(0,255,229,0.5);
  }

  #splash p {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(0,255,229,0.5);
    text-align: center;
    max-width: 280px;
    line-height: 1.8;
  }

  #start-btn {
    background: transparent;
    border: 1px solid var(--plasma);
    color: var(--plasma);
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 12px 28px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    pointer-events: all;
  }
  #start-btn:hover, #start-btn:active {
    background: var(--plasma-dim);
    box-shadow: 0 0 20px rgba(0,255,229,0.3);
  }

  #loading-bar {
    width: 200px;
    height: 1px;
    background: rgba(0,255,229,0.15);
    border-radius: 1px;
    overflow: hidden;
  }
  #loading-fill {
    height: 100%;
    background: var(--plasma);
    width: 0%;
    transition: width 0.3s;
    box-shadow: 0 0 8px var(--plasma);
  }

  #loading-text {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(0,255,229,0.4);
  }

  /* Scanline effect */
  #hud::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
  }

  /* Mode toggle */
  #mode-toggle {
    position: absolute;
    bottom: 54px; right: 16px;
    pointer-events: all;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .mode-btn {
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.2);
    color: rgba(0,255,229,0.5);
    font-family: var(--font);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 8px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  .mode-btn.active {
    border-color: var(--plasma);
    color: var(--plasma);
    background: rgba(0,255,229,0.1);
  }
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="status"><span class="dot"></span><span id="status-text">Initializing</span></div>
  <div id="fps-counter">-- fps</div>
  <div id="hands-count">0 hand(s)</div>
  <div id="info">Move hand in front of camera</div>
  <div id="mode-toggle">
    <button class="mode-btn active" id="btn-mesh">Mesh</button>
    <button class="mode-btn" id="btn-wire">Wire</button>
    <button class="mode-btn" id="btn-skel">Skel</button>
  </div>
</div>

<div id="splash">
  <h1>AR Hand 3D</h1>
  <p>Real-time hand mesh tracking<br>via camera — no LiDAR needed</p>
  <div id="loading-bar"><div id="loading-fill"></div></div>
  <div id="loading-text">Loading models…</div>
  <button id="start-btn" style="display:none">Start Camera</button>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ─────────────────────────────────────────────
//  CONSTANTS & STATE
// ─────────────────────────────────────────────
const LANDMARK_COUNT = 21;

// MediaPipe hand landmark indices
const LM = {
  WRIST: 0,
  THUMB_CMC: 1, THUMB_MCP: 2, THUMB_IP: 3, THUMB_TIP: 4,
  INDEX_MCP: 5, INDEX_PIP: 6, INDEX_DIP: 7, INDEX_TIP: 8,
  MIDDLE_MCP: 9, MIDDLE_PIP: 10, MIDDLE_DIP: 11, MIDDLE_TIP: 12,
  RING_MCP: 13, RING_PIP: 14, RING_DIP: 15, RING_TIP: 16,
  PINKY_MCP: 17, PINKY_PIP: 18, PINKY_DIP: 19, PINKY_TIP: 20,
};

// Skeleton connections (pairs)
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],       // thumb
  [0,5],[5,6],[6,7],[7,8],       // index
  [0,9],[9,10],[10,11],[11,12],  // middle
  [0,13],[13,14],[14,15],[15,16],// ring
  [0,17],[17,18],[18,19],[19,20],// pinky
  [5,9],[9,13],[13,17],          // palm transverse
];

// Finger chains for mesh generation
const FINGERS = [
  { name: 'thumb',  chain: [0,1,2,3,4],     radius: [0.012,0.010,0.009,0.008,0.007] },
  { name: 'index',  chain: [0,5,6,7,8],     radius: [0.010,0.010,0.009,0.008,0.007] },
  { name: 'middle', chain: [0,9,10,11,12],  radius: [0.010,0.011,0.009,0.008,0.007] },
  { name: 'ring',   chain: [0,13,14,15,16], radius: [0.010,0.010,0.009,0.008,0.007] },
  { name: 'pinky',  chain: [0,17,18,19,20], radius: [0.008,0.008,0.007,0.006,0.005] },
];

let renderMode = 'mesh'; // mesh | wire | skel
let handsData = [];
let fps = 0, frameCount = 0, lastFpsTime = performance.now();

// ─────────────────────────────────────────────
//  THREE.JS SETUP
// ─────────────────────────────────────────────
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;

const scene = new THREE.Scene();
const camScene = new THREE.Scene(); // for video background

// Orthographic camera matching screen space
const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, -100, 100);
camera.position.z = 1;

// Video background plane
const videoTex = new THREE.VideoTexture(document.getElementById('cam'));
videoTex.minFilter = THREE.LinearFilter;
videoTex.magFilter = THREE.LinearFilter;
// Mirror horizontally (selfie cam)
videoTex.wrapS = THREE.RepeatWrapping;
videoTex.repeat.x = -1;
videoTex.offset.x = 1;

const bgGeo = new THREE.PlaneGeometry(1, 1);
const bgMat = new THREE.MeshBasicMaterial({ map: videoTex });
const bgMesh = new THREE.Mesh(bgGeo, bgMat);
camScene.add(bgMesh);

// Lights for hand mesh
const ambientLight = new THREE.AmbientLight(0x00ffe5, 0.4);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(0.5, 1, 2);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x00aaff, 0.6);
rimLight.position.set(-1, -0.5, 0.5);
scene.add(rimLight);

// Materials
const meshMat = new THREE.MeshPhongMaterial({
  color: 0x88ddff,
  emissive: 0x003344,
  specular: 0x00ffe5,
  shininess: 80,
  transparent: true,
  opacity: 0.72,
  side: THREE.DoubleSide,
});

const wireMat = new THREE.MeshBasicMaterial({
  color: 0x00ffe5,
  wireframe: true,
  transparent: true,
  opacity: 0.9,
});

const skelMat = new THREE.LineBasicMaterial({
  color: 0x00ffe5,
  linewidth: 2,
  transparent: true,
  opacity: 0.9,
});

const jointMat = new THREE.MeshBasicMaterial({
  color: 0x00ffe5,
  transparent: true,
  opacity: 0.8,
});

const tipMat = new THREE.MeshBasicMaterial({
  color: 0xff4060,
  transparent: true,
  opacity: 0.9,
});

// ─────────────────────────────────────────────
//  HAND MESH POOL
//  Pre-allocate objects, update geometry each frame
// ─────────────────────────────────────────────
class HandRenderer {
  constructor(index) {
    this.index = index;
    this.group = new THREE.Group();
    scene.add(this.group);
    this.group.visible = false;

    this.boneMeshes = [];
    this.jointMeshes = [];
    this.skelLines = [];
    this.palmMesh = null;

    this._buildPool();
  }

  _buildPool() {
    // 20 bone cylinders
    for (let i = 0; i < 20; i++) {
      const geo = new THREE.CylinderGeometry(1, 1, 1, 8, 1);
      const mesh = new THREE.Mesh(geo, meshMat.clone());
      mesh.renderOrder = 1;
      this.group.add(mesh);
      this.boneMeshes.push(mesh);
    }

    // 21 joint spheres
    for (let i = 0; i < 21; i++) {
      const isTip = [4,8,12,16,20].includes(i);
      const geo = new THREE.SphereGeometry(1, 8, 6);
      const mat = isTip ? tipMat.clone() : jointMat.clone();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 2;
      this.group.add(mesh);
      this.jointMeshes.push(mesh);
    }

    // Skeleton lines
    for (let i = 0; i < CONNECTIONS.length; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0, 0,0,0], 3));
      const line = new THREE.Line(geo, skelMat.clone());
      line.renderOrder = 3;
      this.group.add(line);
      this.skelLines.push(line);
    }

    // Palm mesh (convex hull approximation via triangle fan)
    const palmGeo = new THREE.BufferGeometry();
    const palmVerts = new Float32Array(5 * 3 * 3); // 5 tris, 3 verts, xyz
    palmGeo.setAttribute('position', new THREE.BufferAttribute(palmVerts, 3));
    this.palmMesh = new THREE.Mesh(palmGeo, meshMat.clone());
    this.palmMesh.renderOrder = 0;
    this.group.add(this.palmMesh);
  }

  update(landmarks, mode, scaleX, scaleY) {
    if (!landmarks) { this.group.visible = false; return; }
    this.group.visible = true;

    // Convert normalized landmarks to scene coords
    // MediaPipe: x=[0,1] left-to-right, y=[0,1] top-to-bottom, z=depth
    // Scene: x=[-0.5,0.5], y=[0.5,-0.5], z=[-0.1,0.1]
    const pts = landmarks.map(lm => new THREE.Vector3(
      (lm.x - 0.5) * scaleX,
      -(lm.y - 0.5) * scaleY,
      -lm.z * 0.2
    ));

    // Estimate scale from wrist-to-middle-mcp distance
    const wristToMid = pts[0].distanceTo(pts[9]);
    const boneScale = Math.max(wristToMid * 0.13, 0.005);

    const showMesh = mode === 'mesh';
    const showWire = mode === 'wire';
    const showSkel = mode === 'skel';

    // ── Bones ──
    let bIdx = 0;
    FINGERS.forEach((finger, fi) => {
      finger.chain.forEach((lmIdx, segIdx) => {
        if (segIdx === 0) return; // skip wrist as start
        const bone = this.boneMeshes[bIdx];
        if (!bone) return;
        const prevIdx = finger.chain[segIdx - 1];
        const a = pts[prevIdx];
        const b = pts[lmIdx];
        const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
        const len = a.distanceTo(b);
        const r = finger.radius[segIdx] * (wristToMid / 0.12);

        bone.position.copy(mid);
        bone.scale.set(r, len, r);

        // Orient cylinder along bone axis
        const dir = new THREE.Vector3().subVectors(b, a).normalize();
        const up = new THREE.Vector3(0, 1, 0);
        const quaternion = new THREE.Quaternion().setFromUnitVectors(up, dir);
        bone.quaternion.copy(quaternion);

        bone.visible = showMesh || showWire;
        if (showMesh) {
          bone.material.wireframe = false;
          bone.material.transparent = true;
          bone.material.opacity = 0.72;
        } else if (showWire) {
          bone.material.wireframe = true;
          bone.material.opacity = 0.9;
        }
        bIdx++;
      });
    });
    // Hide unused
    for (let i = bIdx; i < this.boneMeshes.length; i++) this.boneMeshes[i].visible = false;

    // ── Joints ──
    pts.forEach((pt, i) => {
      const j = this.jointMeshes[i];
      if (!j) return;
      j.position.copy(pt);
      const isTip = [4,8,12,16,20].includes(i);
      const r = (isTip ? boneScale * 1.4 : boneScale) * (wristToMid / 0.12);
      j.scale.setScalar(r);
      j.visible = showMesh || showSkel;
    });

    // ── Skeleton lines ──
    CONNECTIONS.forEach((conn, i) => {
      const line = this.skelLines[i];
      if (!line) return;
      const posArr = line.geometry.attributes.position.array;
      const a = pts[conn[0]], b = pts[conn[1]];
      posArr[0] = a.x; posArr[1] = a.y; posArr[2] = a.z;
      posArr[3] = b.x; posArr[4] = b.y; posArr[5] = b.z;
      line.geometry.attributes.position.needsUpdate = true;
      line.visible = showSkel || showWire;
    });

    // ── Palm mesh (triangle fan from wrist) ──
    // Palm base joints: wrist(0), thumb_cmc(1), index_mcp(5), middle_mcp(9), ring_mcp(13), pinky_mcp(17)
    const palmBase = [0, 5, 9, 13, 17, 0]; // closed ring
    const posArr = this.palmMesh.geometry.attributes.position.array;
    // 4 tris: 0-5-9, 0-9-13, 0-13-17, 0-1-5
    const tris = [
      [pts[0], pts[5], pts[9]],
      [pts[0], pts[9], pts[13]],
      [pts[0], pts[13], pts[17]],
      [pts[0], pts[1], pts[5]],
      [pts[0], pts[17], pts[16]], // pinky side
    ];
    tris.forEach((tri, ti) => {
      tri.forEach((v, vi) => {
        posArr[(ti * 3 + vi) * 3 + 0] = v.x;
        posArr[(ti * 3 + vi) * 3 + 1] = v.y;
        posArr[(ti * 3 + vi) * 3 + 2] = v.z;
      });
    });
    this.palmMesh.geometry.attributes.position.needsUpdate = true;
    this.palmMesh.geometry.computeVertexNormals();
    this.palmMesh.visible = showMesh;
    if (showMesh) {
      this.palmMesh.material.wireframe = false;
      this.palmMesh.material.opacity = 0.5;
    }
  }

  hide() { this.group.visible = false; }
}

// Pre-allocate 2 hand renderers
const handRenderers = [new HandRenderer(0), new HandRenderer(1)];

// ─────────────────────────────────────────────
//  RESIZE
// ─────────────────────────────────────────────
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);

  // Keep camera aspect correct
  const aspect = w / h;
  if (aspect > 1) {
    camera.left = -aspect * 0.5;
    camera.right = aspect * 0.5;
    camera.top = 0.5;
    camera.bottom = -0.5;
  } else {
    camera.left = -0.5;
    camera.right = 0.5;
    camera.top = 0.5 / aspect;
    camera.bottom = -0.5 / aspect;
  }
  camera.updateProjectionMatrix();

  // bg plane
  bgMesh.scale.set(aspect > 1 ? aspect : 1, aspect < 1 ? 1 / aspect : 1, 1);
}
window.addEventListener('resize', onResize);
onResize();

// ─────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('fps-counter').textContent = fps + ' fps';
  }

  // Update hand renderers
  const aspect = window.innerWidth / window.innerHeight;
  const scaleX = aspect > 1 ? aspect : 1;
  const scaleY = aspect < 1 ? 1 / aspect : 1;

  for (let i = 0; i < 2; i++) {
    if (i < handsData.length) {
      handRenderers[i].update(handsData[i], renderMode, scaleX, scaleY);
    } else {
      handRenderers[i].hide();
    }
  }

  renderer.clear();
  // Draw video background
  renderer.render(camScene, camera);
  renderer.clearDepth();
  // Draw 3D hand overlay
  renderer.render(scene, camera);
}
animate();

// ─────────────────────────────────────────────
//  MEDIAPIPE HANDS SETUP
// ─────────────────────────────────────────────
let mpReady = false;
let mpHands = null;

function initMediaPipe() {
  const loadFill = document.getElementById('loading-fill');
  const loadText = document.getElementById('loading-text');

  loadFill.style.width = '20%';
  loadText.textContent = 'Loading MediaPipe…';

  mpHands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
  });

  mpHands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5,
  });

  mpHands.onResults((results) => {
    if (results.multiHandLandmarks) {
      handsData = results.multiHandLandmarks;
    } else {
      handsData = [];
    }

    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const handsCount = document.getElementById('hands-count');

    if (handsData.length > 0) {
      statusEl.className = 'active';
      statusText.textContent = 'Tracking';
      handsCount.textContent = handsData.length + ' hand(s)';
    } else {
      statusEl.className = '';
      statusText.textContent = 'Scanning';
      handsCount.textContent = '0 hand(s)';
    }
  });

  mpHands.initialize().then(() => {
    mpReady = true;
    loadFill.style.width = '100%';
    loadText.textContent = 'Ready';
    setTimeout(() => {
      document.getElementById('loading-bar').style.display = 'none';
      document.getElementById('loading-text').style.display = 'none';
      document.getElementById('start-btn').style.display = 'block';
    }, 400);
  }).catch(err => {
    loadText.textContent = 'Error: ' + err.message;
    console.error(err);
  });

  // Simulate progress
  let prog = 20;
  const progInterval = setInterval(() => {
    prog = Math.min(prog + 8, 90);
    loadFill.style.width = prog + '%';
    if (prog >= 90) clearInterval(progInterval);
  }, 300);
}

// ─────────────────────────────────────────────
//  CAMERA
// ─────────────────────────────────────────────
const video = document.getElementById('cam');
let mpCamera = null;

async function startCamera() {
  document.getElementById('status-text').textContent = 'Requesting permission…';
  const loadText = document.getElementById('loading-text');

  // Step 1: explicitly request camera permission via getUserMedia
  // This triggers the browser permission prompt on Android Chrome
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
  } catch (err) {
    document.getElementById('status-text').textContent = 'Permission denied';
    loadText.textContent = err.name === 'NotAllowedError'
      ? 'Camera access denied. Allow it in browser settings and reload.'
      : 'Camera error: ' + err.message;
    loadText.style.display = 'block';
    document.getElementById('start-btn').textContent = 'Retry';
    document.getElementById('start-btn').style.display = 'block';
    console.error(err);
    return;
  }

  // Step 2: stop the manual stream — MediaPipe Camera will open its own
  stream.getTracks().forEach(t => t.stop());

  document.getElementById('status-text').textContent = 'Starting camera…';

  try {
    mpCamera = new Camera(video, {
      onFrame: async () => {
        if (mpReady && mpHands) {
          await mpHands.send({ image: video });
        }
      },
      width: 1280,
      height: 720,
      facingMode: 'user',
    });

    await mpCamera.start();

    video.style.opacity = '0';

    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
    }, 600);

    document.getElementById('status-text').textContent = 'Scanning';

  } catch (err) {
    document.getElementById('status-text').textContent = 'Camera error';
    loadText.textContent = 'Failed to start camera: ' + err.message;
    loadText.style.display = 'block';
    console.error(err);
  }
}

// ─────────────────────────────────────────────
//  UI
// ─────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startCamera);

document.getElementById('btn-mesh').addEventListener('click', () => setMode('mesh'));
document.getElementById('btn-wire').addEventListener('click', () => setMode('wire'));
document.getElementById('btn-skel').addEventListener('click', () => setMode('skel'));

function setMode(mode) {
  renderMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');
}

// ─────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────
initMediaPipe();
</script>
</body>
</html>
