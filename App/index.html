<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Hand 3D · 3D Scanner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --plasma:#00ffe5;--warn:#ff4060;
    --ui:#0a0d12;--ui-b:rgba(10,13,18,.82);
    --font:'JetBrains Mono','Fira Mono',monospace;
  }
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--plasma);}
  #cam{position:fixed;top:-9999px;left:-9999px;width:320px;height:240px;opacity:0;pointer-events:none;}
  #gl{position:fixed;inset:0;width:100%!important;height:100%!important;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #hud::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.035) 2px,rgba(0,0,0,.035) 4px);pointer-events:none;}

  .panel{background:var(--ui-b);border:1px solid rgba(0,255,229,.22);border-radius:5px;backdrop-filter:blur(10px);}

  #status{position:absolute;top:16px;left:16px;padding:6px 11px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
  #status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:7px;vertical-align:middle;transition:background .3s;}
  #status.on .dot{background:var(--plasma);}
  #status.on{border-color:rgba(0,255,229,.5);}

  #perf{position:absolute;top:16px;right:16px;padding:4px 8px;font-size:10px;letter-spacing:.08em;color:rgba(0,255,229,.55);}
  #hands{position:absolute;top:46px;right:16px;padding:4px 8px;font-size:10px;letter-spacing:.08em;color:rgba(0,255,229,.55);}

  #info{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(0,255,229,.28);white-space:nowrap;}

  #ctrl{position:absolute;bottom:56px;right:16px;pointer-events:all;display:flex;flex-direction:column;gap:5px;}
  .cb{background:var(--ui-b);border:1px solid rgba(0,255,229,.2);color:rgba(0,255,229,.5);font-family:var(--font);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;cursor:pointer;border-radius:3px;transition:all .18s;backdrop-filter:blur(8px);text-align:center;min-width:54px;}
  .cb.on{border-color:var(--plasma);color:var(--plasma);background:rgba(0,255,229,.1);}
  .cb:active{transform:scale(.95);}
  .sep{height:1px;background:rgba(0,255,229,.1);margin:2px 0;}

  /* Torch glow indicator */
  #torch-indicator{position:absolute;top:76px;right:16px;padding:4px 8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,200,80,.0);transition:color .3s;}
  #torch-indicator.on{color:rgba(255,200,80,.8);}

  /* Splash */
  #splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s;}
  #splash h1{font-size:clamp(20px,5vw,32px);letter-spacing:.22em;text-transform:uppercase;color:var(--plasma);text-shadow:0 0 28px rgba(0,255,229,.45);}
  #splash p{font-size:11px;letter-spacing:.12em;color:rgba(0,255,229,.45);text-align:center;max-width:270px;line-height:1.9;}
  #start-btn{background:transparent;border:1px solid var(--plasma);color:var(--plasma);font-family:var(--font);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:11px 26px;cursor:pointer;border-radius:2px;transition:all .2s;}
  #start-btn:active{background:rgba(0,255,229,.12);}
  #lbar{width:190px;height:1px;background:rgba(0,255,229,.13);border-radius:1px;overflow:hidden;}
  #lfill{height:100%;background:var(--plasma);width:0%;transition:width .28s;box-shadow:0 0 7px var(--plasma);}
  #ltxt{font-size:10px;letter-spacing:.15em;color:rgba(0,255,229,.38);}

  /* ── Scanner overlay ── */
  #scan-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.88);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:0;
  }
  #scan-overlay.active{display:flex;}

  #scan-title{
    font-size:10px;letter-spacing:.25em;text-transform:uppercase;
    color:rgba(0,255,229,.4);margin-bottom:18px;
  }

  /* Pose silhouette SVG area */
  #scan-svg-wrap{
    width:min(55vw,220px);height:min(55vw,220px);
    position:relative;margin-bottom:20px;
  }
  #scan-svg{width:100%;height:100%;}

  /* Animated ring around silhouette */
  #scan-ring{
    position:absolute;inset:-8px;
    border-radius:50%;
    border:1px solid rgba(0,255,229,.15);
  }
  #scan-ring-progress{
    position:absolute;inset:-8px;
    border-radius:50%;
  }

  #scan-pose-name{
    font-size:16px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--plasma);text-shadow:0 0 20px rgba(0,255,229,.5);
    margin-bottom:8px;text-align:center;
  }
  #scan-instruction{
    font-size:10px;letter-spacing:.12em;color:rgba(0,255,229,.45);
    text-align:center;max-width:260px;line-height:1.8;margin-bottom:18px;
  }

  /* Countdown ring */
  #scan-countdown-wrap{
    position:relative;width:64px;height:64px;margin-bottom:16px;
  }
  #scan-countdown-svg{width:64px;height:64px;transform:rotate(-90deg);}
  #scan-countdown-track{fill:none;stroke:rgba(0,255,229,.1);stroke-width:3;}
  #scan-countdown-arc{
    fill:none;stroke:var(--plasma);stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:163;stroke-dashoffset:163;
    transition:stroke-dashoffset .1s linear;
    filter:drop-shadow(0 0 4px rgba(0,255,229,.6));
  }
  #scan-countdown-arc.capturing{stroke:rgba(255,200,80,.9);filter:drop-shadow(0 0 4px rgba(255,200,80,.6));}
  #scan-countdown-num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;letter-spacing:0;color:var(--plasma);
  }

  /* Per-pose dots */
  #scan-dots{display:flex;gap:7px;margin-bottom:20px;}
  .sdot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(0,255,229,.12);border:1px solid rgba(0,255,229,.2);
    transition:all .3s;
  }
  .sdot.active{background:rgba(0,255,229,.5);border-color:var(--plasma);box-shadow:0 0 6px rgba(0,255,229,.4);}
  .sdot.done{background:var(--plasma);border-color:var(--plasma);box-shadow:0 0 8px rgba(0,255,229,.5);}

  /* Detection quality bar */
  #scan-quality-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  #scan-quality-label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,255,229,.3);}
  #scan-quality-bar{width:100px;height:2px;background:rgba(0,255,229,.1);border-radius:1px;overflow:hidden;}
  #scan-quality-fill{height:100%;background:var(--plasma);width:0%;transition:width .15s;}

  #scan-cancel{
    background:transparent;border:1px solid rgba(0,255,229,.2);
    color:rgba(0,255,229,.35);font-family:var(--font);font-size:9px;
    letter-spacing:.15em;text-transform:uppercase;padding:7px 18px;
    cursor:pointer;border-radius:2px;transition:all .2s;margin-top:4px;
  }
  #scan-cancel:active{background:rgba(255,64,96,.1);border-color:rgba(255,64,96,.4);color:rgba(255,64,96,.7);}

  /* ── Scan complete modal ── */
  #scan-result{
    position:fixed;inset:0;z-index:60;
    background:rgba(0,0,0,.92);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
  }
  #scan-result.active{display:flex;}
  #scan-result h2{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--plasma);text-shadow:0 0 20px rgba(0,255,229,.4);}
  #scan-metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin:4px 0;}
  .smet{display:flex;flex-direction:column;gap:2px;}
  .smet-label{font-size:7px;letter-spacing:.15em;text-transform:uppercase;color:rgba(0,255,229,.3);}
  .smet-val{font-size:12px;letter-spacing:.08em;color:var(--plasma);}
  #scan-result-btns{display:flex;gap:8px;margin-top:6px;}
  .sr-btn{
    background:transparent;border:1px solid rgba(0,255,229,.3);
    color:rgba(0,255,229,.6);font-family:var(--font);font-size:9px;
    letter-spacing:.15em;text-transform:uppercase;padding:8px 16px;
    cursor:pointer;border-radius:2px;transition:all .2s;
  }
  .sr-btn.primary{border-color:var(--plasma);color:var(--plasma);background:rgba(0,255,229,.08);}
  .sr-btn:active{transform:scale(.96);}

  /* ── Point cloud badge ── */
  #cloud-badge{
    position:absolute;top:76px;left:16px;padding:4px 8px;
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(0,255,229,.0);transition:color .3s;pointer-events:none;
  }
  #cloud-badge.on{color:rgba(0,255,229,.55);}

  /* Scan button highlight */
  #bscan.scanning{border-color:rgba(255,200,80,.7);color:rgba(255,200,80,.9);background:rgba(255,200,80,.08);}
  #bscan.done{border-color:var(--plasma);color:var(--plasma);background:rgba(0,255,229,.1);}

  /* ── Depth / contrast / occlusion HUD panel ── */
  #depth-panel{
    position:absolute;bottom:22px;left:16px;
    padding:7px 10px;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;pointer-events:none;
    display:flex;flex-direction:column;gap:4px;min-width:130px;
  }
  .dp-row{display:flex;align-items:center;gap:6px;}
  .dp-lbl{color:rgba(0,255,229,.32);min-width:52px;}
  .dp-bar{flex:1;height:2px;background:rgba(0,255,229,.08);border-radius:1px;overflow:hidden;}
  .dp-fill{height:100%;border-radius:1px;transition:width .12s,background .25s;}
  .dp-val{color:rgba(0,255,229,.5);min-width:28px;text-align:right;font-size:8px;}

  /* Occluded-landmark badges on fingertips */
  .occ-badge{
    position:absolute;pointer-events:none;
    width:10px;height:10px;border-radius:50%;
    border:1px solid rgba(255,180,40,.8);
    background:rgba(255,140,0,.18);
    transform:translate(-50%,-50%);
    transition:opacity .2s;
    box-shadow:0 0 5px rgba(255,160,0,.5);
  }
  #occ-overlay{position:fixed;inset:0;pointer-events:none;z-index:9;}

  /* ── White screen light source ── */
  #white-screen{
    position:fixed;inset:0;z-index:200;
    background:#fff;
    display:none;cursor:pointer;
  }
  #white-screen.active{display:block;}
  #bwhite.on{border-color:#fff;color:#fff;background:rgba(255,255,255,.12);}
</style>
</head>
<body>
<video id="cam" playsinline autoplay muted width="320" height="240"></video>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="status" class="panel"><span class="dot"></span><span id="stxt">Initializing</span></div>
  <div id="perf" class="panel">-- fps · -- ms</div>
  <div id="hands" class="panel">0 hand(s)</div>
  <div id="torch-indicator">⚡ Torch</div>
  <div id="cloud-badge">◈ Point Cloud</div>
  <div id="info">Show hand to camera</div>
  <div id="depth-panel" class="panel" style="display:none;">
    <div class="dp-row">
      <span class="dp-lbl">Depth</span>
      <div class="dp-bar"><div class="dp-fill" id="dp-depth" style="width:0%;background:var(--plasma);"></div></div>
      <span class="dp-val" id="dpv-depth">--</span>
    </div>
    <div class="dp-row">
      <span class="dp-lbl">Contrast</span>
      <div class="dp-bar"><div class="dp-fill" id="dp-contrast" style="width:0%;background:rgba(0,200,255,.9);"></div></div>
      <span class="dp-val" id="dpv-contrast">--</span>
    </div>
    <div class="dp-row">
      <span class="dp-lbl">Position</span>
      <div class="dp-bar"><div class="dp-fill" id="dp-position" style="width:0%;background:rgba(120,255,120,.9);"></div></div>
      <span class="dp-val" id="dpv-position">--</span>
    </div>
    <div class="dp-row">
      <span class="dp-lbl">Occluded</span>
      <span class="dp-val" id="dpv-occluded" style="color:rgba(255,160,40,.7);min-width:80px;">none</span>
    </div>
  </div>
  <div id="ctrl">
    <button class="cb on" id="bm">Mesh</button>
    <button class="cb" id="bw">Wire</button>
    <button class="cb" id="bs">Skel</button>
    <div class="sep"></div>
    <button class="cb" id="bcloud">Cloud</button>
    <div class="sep"></div>
    <button class="cb on" id="bt">Torch</button>
    <div class="sep"></div>
    <button class="cb" id="bwhite">White</button>
    <div class="sep"></div>
    <button class="cb" id="bscan">Scan</button>
    <div class="sep"></div>
    <button class="cb" id="bc">↺ Cam</button>
  </div>
</div>

<!-- White screen light source — tap anywhere to dismiss -->
<div id="white-screen"></div>
<!-- Occlusion badge overlay (canvas-coordinate space badges for inferred landmarks) -->
<div id="occ-overlay"></div>

<!-- Scanner overlay -->
<div id="scan-overlay">
  <div id="scan-title">3D Hand Scanner</div>
  <div id="scan-dots">
    <div class="sdot" id="sdot-0"></div>
    <div class="sdot" id="sdot-1"></div>
    <div class="sdot" id="sdot-2"></div>
    <div class="sdot" id="sdot-3"></div>
    <div class="sdot" id="sdot-4"></div>
    <div class="sdot" id="sdot-5"></div>
    <div class="sdot" id="sdot-6"></div>
    <div class="sdot" id="sdot-7"></div>
  </div>
  <div id="scan-svg-wrap">
    <svg id="scan-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Hand silhouette paths, swapped per pose by JS -->
      <g id="scan-sil" opacity="0.35" stroke="rgba(0,255,229,1)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Default: palm front - simple hand outline -->
        <path d="M38 95 Q30 80 30 65 L30 42 Q30 36 36 36 Q42 36 42 42 L42 38 Q42 32 48 32 Q54 32 54 38 L54 36 Q54 30 60 30 Q66 30 66 36 L66 38 Q66 32 72 32 Q78 32 78 38 L78 65 Q78 75 82 85 Q86 95 80 100 Q60 108 40 100 Z"/>
        <line x1="42" y1="42" x2="42" y2="95"/>
        <line x1="54" y1="38" x2="54" y2="95"/>
        <line x1="66" y1="36" x2="66" y2="95"/>
        <line x1="78" y1="38" x2="78" y2="95"/>
      </g>
    </svg>
    <div id="scan-ring"></div>
    <svg id="scan-ring-progress" style="position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);" viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="116" fill="none" stroke="rgba(0,255,229,.08)" stroke-width="2"/>
      <circle id="scan-arc" cx="120" cy="120" r="116" fill="none" stroke="rgba(0,255,229,.7)" stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="729" stroke-dashoffset="729"
        transform="rotate(-90 120 120)"
        style="transition:stroke-dashoffset .1s linear;filter:drop-shadow(0 0 4px rgba(0,255,229,.5))"/>
    </svg>
  </div>
  <div id="scan-pose-name">—</div>
  <div id="scan-instruction">Hold your hand steady</div>
  <div id="scan-countdown-wrap">
    <svg id="scan-countdown-svg" viewBox="0 0 64 64">
      <circle class="scan-countdown-track" cx="32" cy="32" r="26" fill="none" stroke="rgba(0,255,229,.1)" stroke-width="3"/>
      <circle id="scan-countdown-arc" cx="32" cy="32" r="26" fill="none" stroke="rgba(0,255,229,.9)" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="163"
        transform="rotate(-90 32 32)"
        style="transition:stroke-dashoffset .08s linear;filter:drop-shadow(0 0 3px rgba(0,255,229,.6));"/>
    </svg>
    <div id="scan-countdown-num">—</div>
  </div>
  <div id="scan-quality-row">
    <span id="scan-quality-label">Signal</span>
    <div id="scan-quality-bar"><div id="scan-quality-fill"></div></div>
  </div>
  <div id="scan-motion-row" style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
    <span style="font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,255,229,.3);">Motion</span>
    <div style="width:100px;height:2px;background:rgba(0,255,229,.1);border-radius:1px;overflow:hidden;"><div id="scan-motion-fill" style="height:100%;background:rgba(255,200,80,.8);width:0%;transition:width .15s;"></div></div>
    <span id="scan-motion-txt" style="font-size:8px;letter-spacing:.1em;color:rgba(255,200,80,.5);min-width:50px;"></span>
  </div>
  <button id="scan-cancel">Cancel</button>
</div>

<!-- Scan result modal -->
<div id="scan-result">
  <h2>Scan Complete</h2>
  <div id="scan-metrics"></div>
  <div id="scan-result-btns">
    <button class="sr-btn" id="sr-discard">Discard</button>
    <button class="sr-btn primary" id="sr-apply">Apply to Model</button>
  </div>
</div>

<div id="splash">
  <h1>AR Hand 3D</h1>
  <p>Anatomical hand model · 60fps TF.js backbone<br>3D Scanner · Personalized model</p>
  <div id="lbar"><div id="lfill"></div></div>
  <div id="ltxt">Loading…</div>
  <button id="start-btn" style="display:none">Start</button>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- TF.js + HandPose (WebGL GPU inference) -->
<!-- MediaPipe Tasks Vision (WASM-based, replaces TF.js) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
  type="module" crossorigin="anonymous"></script>

<script type="module">

// ─── Skeleton topology ────────────────────────────────────────────────────
const CONN = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

// Per-segment taper radii (relative, scaled at runtime)
const FINGERS = [
  {c:[0,1,2,3,4],   r:[.38,.30,.26,.22,.18]}, // thumb
  {c:[0,5,6,7,8],   r:[.32,.32,.27,.23,.18]}, // index
  {c:[0,9,10,11,12],r:[.32,.34,.28,.24,.19]}, // middle
  {c:[0,13,14,15,16],r:[.30,.30,.26,.22,.18]}, // ring
  {c:[0,17,18,19,20],r:[.26,.24,.20,.17,.14]}, // pinky
];
const TIPS = new Set([4,8,12,16,20]);
const KNUCKLES = new Set([5,9,13,17]);

// ─── State ────────────────────────────────────────────────────────────────
let mode = 'mesh';
let torchOn = true;
let facingMode = 'user';
let activeCameraTrack = null;
let inferenceMs = 0;
let fps = 0, fc = 0, ft = performance.now();

// ─── Renderer ─────────────────────────────────────────────────────────────
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
const canvas = document.getElementById('gl');
const R = new THREE.WebGLRenderer({
  canvas,
  antialias: !isMobile,           // antialias off on mobile — saves ~15% GPU
  powerPreference: 'high-performance',
});
R.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1) : Math.min(window.devicePixelRatio, 2));
R.setClearColor(0x000000, 1);
R.shadowMap.enabled = false;
R.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();

// Orthographic camera — landmark coords map directly to screen
const CAM = new THREE.OrthographicCamera(-1,1,1,-1,-10,10);
CAM.position.z = 1;

// ─── Detection state ──────────────────────────────────────────────────────
let detector = null, detectorReady = false;
let camStream = null;
let rawHands    = []; // latest from GPU detector (async)
let smoothHands = []; // exponentially smoothed, used for render (60fps)

// Separate smoothing for xy (stable) vs z (faster for responsiveness)
const SMOOTH_XY = isMobile ? 0.65 : 0.50;
const SMOOTH_Z  = isMobile ? 0.45 : 0.30;

// ─── Contrast / Depth Analysis ────────────────────────────────────────────
// Off-screen canvas for pixel sampling — kept tiny for speed
const _analysisCvs = document.createElement('canvas');
_analysisCvs.width  = 80;
_analysisCvs.height = 60;
const _analysisCtx = _analysisCvs.getContext('2d', { willReadFrequently: true });

// Sample image brightness/contrast around hand landmarks
// Returns { contrast: 0..1, brightness: 0..1 }
function sampleVideoContrast(lms) {
  if (!video.videoWidth || !lms || lms.length === 0) return { contrast: 0, brightness: 0 };
  try {
    _analysisCtx.drawImage(video, 0, 0, 80, 60);
    const data = _analysisCtx.getImageData(0, 0, 80, 60).data;

    // Sample only pixels near hand landmarks (project to 80×60)
    const sxs = lms.map(l => Math.min(79, Math.max(0, Math.round(l.x * 80))));
    const sys = lms.map(l => Math.min(59, Math.max(0, Math.round(l.y * 60))));

    const vals = [];
    for (let i = 0; i < lms.length; i++) {
      // 3×3 window around each landmark pixel
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const px = Math.min(79, Math.max(0, sxs[i] + dx));
          const py = Math.min(59, Math.max(0, sys[i] + dy));
          const idx = (py * 80 + px) * 4;
          const lum = (data[idx] * 0.299 + data[idx+1] * 0.587 + data[idx+2] * 0.114) / 255;
          vals.push(lum);
        }
      }
    }

    if (vals.length === 0) return { contrast: 0, brightness: 0 };

    const mean = vals.reduce((s, v) => s + v, 0) / vals.length;
    const variance = vals.reduce((s, v) => s + (v - mean) ** 2, 0) / vals.length;
    const stddev = Math.sqrt(variance);

    return {
      contrast:   Math.min(1, stddev * 6),    // stddev → 0..1 contrast score
      brightness: mean,
    };
  } catch(e) {
    return { contrast: 0, brightness: 0 };
  }
}

// Compute depth quality: how much z-variance is present (rich 3D info = good)
// and how centred the hand is (centred = better model accuracy)
function computeDepthAndPosition(lms) {
  if (!lms || lms.length === 0) return { depth: 0, position: 0, zSpread: 0 };

  // Z spread — MediaPipe z is relative depth; higher spread = more 3D articulation
  const zVals = lms.map(l => l.z);
  const zMean = zVals.reduce((s,v) => s+v, 0) / zVals.length;
  const zVar  = zVals.reduce((s,v) => s + (v - zMean)**2, 0) / zVals.length;
  const zSpread = Math.sqrt(zVar);

  // Depth score: normalise spread to 0..1 (typical max ~0.08)
  const depth = Math.min(1, zSpread / 0.06);

  // Position score: penalise if hand centroid is near edges (risk of landmark loss)
  const cx = lms.reduce((s,l) => s + l.x, 0) / lms.length;
  const cy = lms.reduce((s,l) => s + l.y, 0) / lms.length;
  // Edge margin: 0.15 from each side is "danger zone"
  const margin = 0.15;
  const inX = Math.min(cx, 1 - cx) / margin;  // 0 at edge, 1 when margin away
  const inY = Math.min(cy, 1 - cy) / margin;
  const position = Math.min(1, Math.min(inX, inY));

  return { depth, position, zSpread };
}

// ─── Hand Occlusion Inference Engine ─────────────────────────────────────
// MediaPipe still emits ALL 21 landmarks even during occlusion, but occluded
// ones have poor z accuracy and sometimes snap. We detect which landmarks are
// likely occluded and blend between the raw detection and a biomechanical
// forward-kinematic estimate based on the known hand pose.

// Occlusion detection: a landmark is suspicious when its z vs neighbours
// deviates significantly, OR when it's very close to the palm/wrist
const OCC_FINGER_CHAINS = [
  [1,2,3,4],    // thumb
  [5,6,7,8],    // index
  [9,10,11,12], // middle
  [13,14,15,16],// ring
  [17,18,19,20],// pinky
];
const LANDMARK_NAMES = [
  'Wrist','Thumb CMC','Thumb MCP','Thumb IP','Thumb Tip',
  'Index MCP','Index PIP','Index DIP','Index Tip',
  'Middle MCP','Middle PIP','Middle DIP','Middle Tip',
  'Ring MCP','Ring PIP','Ring DIP','Ring Tip',
  'Pinky MCP','Pinky PIP','Pinky DIP','Pinky Tip'
];

// Per-landmark smoothed occlusion probability
const occlusionProb = new Float32Array(21).fill(0);
// History of last N good (unoccluded) positions per landmark
const landmarkHistory = Array.from({length:21}, () => ({ x:0, y:0, z:0, valid:false }));

// Detect which landmarks are likely occluded using:
// 1. Z-deviation from expected chain progression
// 2. Proximity to palm plane
// 3. Confidence from MediaPipe (via score if available, else heuristic)
function detectOcclusion(lms) {
  const occluded = new Uint8Array(21); // 1 = likely occluded

  // Palm plane: defined by wrist(0), index MCP(5), pinky MCP(17)
  const p0 = lms[0], p5 = lms[5], p17 = lms[17];
  const palmVec1 = { x: p5.x-p0.x,  y: p5.y-p0.y,  z: (p5.z||0)-(p0.z||0) };
  const palmVec2 = { x: p17.x-p0.x, y: p17.y-p0.y, z: (p17.z||0)-(p0.z||0) };
  // Normal (cross product)
  const palmNorm = {
    x: palmVec1.y * palmVec2.z - palmVec1.z * palmVec2.y,
    y: palmVec1.z * palmVec2.x - palmVec1.x * palmVec2.z,
    z: palmVec1.x * palmVec2.y - palmVec1.y * palmVec2.x,
  };
  const pnLen = Math.sqrt(palmNorm.x**2 + palmNorm.y**2 + palmNorm.z**2) || 1;
  palmNorm.x /= pnLen; palmNorm.y /= pnLen; palmNorm.z /= pnLen;

  const palmRef = Math.max(Math.sqrt((p5.x-p0.x)**2 + (p5.y-p0.y)**2 + ((p5.z||0)-(p0.z||0))**2), 0.001);

  for (const chain of OCC_FINGER_CHAINS) {
    // Check each joint in chain for biomechanical plausibility
    for (let ci = 1; ci < chain.length; ci++) {
      const prev = lms[chain[ci-1]];
      const curr = lms[chain[ci]];

      // 1. Segment length plausibility: each distal segment ≤ proximal in length
      //    If segment length is anomalously large, likely occluded/lost
      const segLen = Math.sqrt((curr.x-prev.x)**2 + (curr.y-prev.y)**2 + ((curr.z||0)-(prev.z||0))**2);
      if (segLen > palmRef * 1.4) {
        occluded[chain[ci]] = 1;
        continue;
      }

      // 2. Z-depth relative to palm normal — if a distal landmark is
      //    significantly BEHIND the palm plane, it's behind the hand
      const relX = curr.x - p0.x;
      const relY = curr.y - p0.y;
      const relZ = (curr.z || 0) - (p0.z || 0);
      const distToPalm = relX*palmNorm.x + relY*palmNorm.y + relZ*palmNorm.z;
      // Negative = behind palm (occluded)
      if (distToPalm < -palmRef * 0.25) {
        occluded[chain[ci]] = 1;
        continue;
      }

      // 3. Z-chain reversal: each distal joint should be ≥ palm z (further from camera)
      //    If a middle joint is much closer than its proximal, suspect occlusion
      const prevPrevIdx = ci >= 2 ? chain[ci-2] : chain[0];
      const pp = lms[prevPrevIdx];
      const zDelta = (curr.z||0) - (prev.z||0);
      const expectedZ = (prev.z||0) - (pp.z||0); // expected direction
      if (ci >= 2 && Math.abs(zDelta - expectedZ) > 0.08 && segLen < palmRef * 0.3) {
        occluded[chain[ci]] = 1;
      }
    }
  }

  return occluded;
}

// Forward-kinematic inference: estimate position of an occluded landmark
// based on the known chain above it + anatomical constraints
function inferOccludedLandmark(lms, lmIdx, occluded) {
  // Find which chain and position this landmark is in
  for (const chain of OCC_FINGER_CHAINS) {
    const pos = chain.indexOf(lmIdx);
    if (pos < 0) continue;

    // Find last known good landmark in this chain
    let lastGoodIdx = -1;
    for (let i = pos - 1; i >= 0; i--) {
      if (!occluded[chain[i]]) { lastGoodIdx = i; break; }
    }
    if (lastGoodIdx < 0) {
      // All chain above occluded — use history
      if (landmarkHistory[lmIdx].valid) {
        return { ...landmarkHistory[lmIdx], inferred: true };
      }
      return null;
    }

    // Compute expected direction from last 2 good joints (tangent)
    const anchorIdx = chain[lastGoodIdx];
    const prevAnchorIdx = lastGoodIdx > 0 ? chain[lastGoodIdx-1] : 0;
    const anchor = lms[anchorIdx];
    const prevA  = lms[prevAnchorIdx];

    // Segment direction (normalised)
    const dx = anchor.x - prevA.x;
    const dy = anchor.y - prevA.y;
    const dz = (anchor.z||0) - (prevA.z||0);
    const dLen = Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.001;

    // Expected segment length ≈ same as anchor→prevAnchor
    const stepsAway = pos - lastGoodIdx;
    // Distal segments are slightly shorter (taper factor ~0.88 per joint)
    const taperFactor = Math.pow(0.88, stepsAway);
    const expectedLen = (dLen / 1) * taperFactor;

    const inferred = {
      x: anchor.x + (dx / dLen) * expectedLen * stepsAway,
      y: anchor.y + (dy / dLen) * expectedLen * stepsAway,
      z: (anchor.z||0) + (dz / dLen) * expectedLen * stepsAway,
      inferred: true,
    };

    // Blend with history for temporal stability (70% inferred, 30% history)
    if (landmarkHistory[lmIdx].valid) {
      const h = landmarkHistory[lmIdx];
      return {
        x: inferred.x * 0.7 + h.x * 0.3,
        y: inferred.y * 0.7 + h.y * 0.3,
        z: inferred.z * 0.7 + h.z * 0.3,
        inferred: true,
      };
    }
    return inferred;
  }

  // Not in any finger chain (wrist / palm landmarks) — just use history
  if (landmarkHistory[lmIdx].valid) {
    return { ...landmarkHistory[lmIdx], inferred: true };
  }
  return null;
}

// Apply occlusion inference to a full landmark set:
// updates landmarkHistory and fills in inferred positions
function applyOcclusionInference(lms) {
  const occluded = detectOcclusion(lms);
  const result   = lms.map(l => ({...l, inferred: false}));
  const occNames = [];

  for (let i = 0; i < 21; i++) {
    if (occluded[i]) {
      // Try to infer
      const inf = inferOccludedLandmark(lms, i, occluded);
      if (inf) {
        // Smooth occlusion probability up
        occlusionProb[i] = Math.min(1, occlusionProb[i] + 0.3);
        result[i] = inf;
        occNames.push(LANDMARK_NAMES[i]);
      } else {
        occlusionProb[i] = Math.min(1, occlusionProb[i] + 0.15);
      }
    } else {
      // Good landmark — update history and decay occlusion prob
      occlusionProb[i] = Math.max(0, occlusionProb[i] - 0.2);
      landmarkHistory[i] = { x: lms[i].x, y: lms[i].y, z: lms[i].z||0, valid: true };
    }
  }

  return { lms: result, occluded, occNames };
}

// Smooth occlusion inference blending — inferred landmarks fade in to avoid snapping
const _prevInferredLms = [];
function blendInferredLandmarks(prev, next) {
  if (!prev || prev.length !== next.length) return next;
  return next.map((lm, i) => {
    if (!lm.inferred) return lm;
    // If we have a prev, smooth the inferred position
    if (prev[i]) {
      const alpha = 0.35; // how fast inferred position updates (slower = more stable)
      return {
        x: prev[i].x + (lm.x - prev[i].x) * alpha,
        y: prev[i].y + (lm.y - prev[i].y) * alpha,
        z: prev[i].z + (lm.z - prev[i].z) * alpha,
        inferred: true,
      };
    }
    return lm;
  });
}

// HUD update for depth/contrast/position metrics
let _lastContrastSample = 0;
const _contrastSmooth = { contrast: 0, depth: 0, position: 0 };

function updateDepthHUD(lms) {
  const panel = document.getElementById('depth-panel');
  if (!lms || lms.length === 0) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';

  const now = performance.now();
  // Sample contrast every 200ms (pixel read is slightly expensive)
  if (now - _lastContrastSample > 200) {
    _lastContrastSample = now;
    const { contrast } = sampleVideoContrast(lms);
    const { depth, position } = computeDepthAndPosition(lms);
    _contrastSmooth.contrast = _contrastSmooth.contrast * 0.6 + contrast * 0.4;
    _contrastSmooth.depth    = _contrastSmooth.depth    * 0.6 + depth    * 0.4;
    _contrastSmooth.position = _contrastSmooth.position * 0.6 + position * 0.4;
  }

  const c = Math.round(_contrastSmooth.contrast  * 100);
  const d = Math.round(_contrastSmooth.depth     * 100);
  const p = Math.round(_contrastSmooth.position  * 100);

  const contrastColor = c > 60 ? 'rgba(0,200,255,.9)' : c > 30 ? 'rgba(255,200,80,.9)' : 'rgba(255,80,80,.9)';
  const depthColor    = d > 60 ? 'var(--plasma)'       : d > 30 ? 'rgba(255,200,80,.9)' : 'rgba(255,80,80,.9)';
  const posColor      = p > 60 ? 'rgba(100,255,120,.9)': p > 30 ? 'rgba(255,200,80,.9)' : 'rgba(255,80,80,.9)';

  document.getElementById('dp-depth').style.cssText    = `width:${d}%;background:${depthColor};`;
  document.getElementById('dp-contrast').style.cssText = `width:${c}%;background:${contrastColor};`;
  document.getElementById('dp-position').style.cssText = `width:${p}%;background:${posColor};`;
  document.getElementById('dpv-depth').textContent    = d + '%';
  document.getElementById('dpv-contrast').textContent = c + '%';
  document.getElementById('dpv-position').textContent = p + '%';
}

// Draw occlusion badges on the overlay for inferred finger tips
function updateOcclusionOverlay(allLmsArr, mirrorX) {
  const overlay = document.getElementById('occ-overlay');
  const W = window.innerWidth, H = window.innerHeight;
  const aspect = W / H;

  // Collect all inferred tip-ish landmarks across all hands
  const badges = [];
  const occludedNames = new Set();

  allLmsArr.forEach(lms => {
    if (!lms) return;
    lms.forEach((lm, i) => {
      if (!lm.inferred) return;
      // Project to screen (same logic as HandRenderer.update)
      const nx = mirrorX ? (1 - lm.x) : lm.x;
      const sx = ((nx - 0.5) * 2 * aspect); // in camera space -aspect..+aspect
      const sy = -(lm.y - 0.5) * 2;         // -1..+1

      // Convert to CSS pixels
      const px = (sx / (2 * aspect) + 0.5) * W;
      const py = (-sy / 2 + 0.5) * H;
      badges.push({ px, py, name: LANDMARK_NAMES[i], prob: occlusionProb[i] });
      occludedNames.add(LANDMARK_NAMES[i]);
    });
  });

  // Update badge elements (reuse existing)
  const existing = overlay.querySelectorAll('.occ-badge');
  existing.forEach((el, i) => {
    if (i >= badges.length) { el.style.display = 'none'; return; }
    const b = badges[i];
    el.style.display   = '';
    el.style.left      = b.px + 'px';
    el.style.top       = b.py + 'px';
    el.style.opacity   = b.prob.toFixed(2);
  });
  // Create new badges if needed
  for (let i = existing.length; i < badges.length; i++) {
    const el = document.createElement('div');
    el.className = 'occ-badge';
    el.style.position = 'absolute';
    const b = badges[i];
    el.style.left    = b.px + 'px';
    el.style.top     = b.py + 'px';
    el.style.opacity = b.prob.toFixed(2);
    el.title         = b.name + ' (inferred)';
    overlay.appendChild(el);
  }
  // Update occluded HUD text
  const occEl = document.getElementById('dpv-occluded');
  if (occEl) {
    if (occludedNames.size === 0) {
      occEl.textContent = 'none';
      occEl.style.color = 'rgba(0,255,229,.3)';
    } else {
      // Shorten names for compact display
      const short = [...occludedNames].map(n => n.replace(/ MCP| PIP| DIP| CMC| IP/,'').split(' ').map((w,i)=>i===0?w[0]:w).join(''));
      occEl.textContent = short.slice(0,4).join(' ') + (short.length > 4 ? '+' : '');
      occEl.style.color = 'rgba(255,160,40,.8)';
    }
  }
}

// Flicker rejection: count consecutive frames each hand slot has been present
const handPersistCount = [0, 0];
const PERSIST_MIN = 2; // frames before a newly detected hand is accepted

// Velocity clamp: max movement per frame in normalised coords
// prevents landmark teleporting from bad frames
const MAX_DELTA_XY = 0.18;
const MAX_DELTA_Z  = 0.35;

function clampDelta(prev, next) {
  const dx = next.x - prev.x, dy = next.y - prev.y, dz = next.z - prev.z;
  const dxy = Math.sqrt(dx*dx + dy*dy);
  const scaleXY = dxy > MAX_DELTA_XY ? MAX_DELTA_XY / dxy : 1;
  const cz = Math.abs(dz) > MAX_DELTA_Z ? prev.z + Math.sign(dz)*MAX_DELTA_Z : next.z;
  return {
    x: prev.x + dx * scaleXY,
    y: prev.y + dy * scaleXY,
    z: cz,
  };
}

function smoothLandmarks(prev, next) {
  if (!prev || prev.length !== next.length) return next.map(l => ({...l}));
  return next.map((lm, i) => {
    const clamped = clampDelta(prev[i], lm);
    return {
      x: prev[i].x + (clamped.x - prev[i].x) * (1 - SMOOTH_XY),
      y: prev[i].y + (clamped.y - prev[i].y) * (1 - SMOOTH_XY),
      z: prev[i].z + (clamped.z - prev[i].z) * (1 - SMOOTH_Z),
    };
  });
}

// ─── Hand renderer ────────────────────────────────────────────────────────
const UP = new THREE.Vector3(0, 1, 0);

// Fingernail geometry: flat quad cap oriented at fingertip
function buildNailGeo() {
  const g = new THREE.BufferGeometry();
  // Two triangles forming a small flat rounded rectangle
  const w = 0.55, h = 0.38, d = 0.06; // in units of unitR
  const pos = new Float32Array([
    -w,  h, d,   w,  h, d,   w, -h*0.3, d,
    -w,  h, d,   w, -h*0.3, d,  -w, -h*0.3, d,
  ]);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

class HandRenderer {
  constructor() {
    this.group = new THREE.Group();
    scene.add(this.group);
    this.group.visible = false;
    this.bones     = [];
    this.boneRims  = []; // rim shells
    this.joints    = [];
    this.lines     = [];
    this.nails     = []; // 5 fingernail meshes
    this.palmMesh  = null;
    this.palmRim   = null;
    this._unitR    = 0.01; // updated each frame
    this._build();
  }

  _build() {
    // 20 bone segments — tapered cylinder, 10 radial segments for smoothness
    // Taper per segment: tip_r/base_r, anatomically realistic
    const TAPER = [
      // thumb (4 segs: metacarpal, prox, inter, distal)
      0.72, 0.78, 0.80, 0.82,
      // index (4 segs)
      0.78, 0.80, 0.82, 0.84,
      // middle (4 segs)
      0.78, 0.80, 0.83, 0.85,
      // ring (4 segs)
      0.76, 0.79, 0.82, 0.84,
      // pinky (4 segs)
      0.72, 0.76, 0.80, 0.83,
    ];
    for (let i = 0; i < 20; i++) {
      const t = TAPER[i] || 0.80;
      const geo = new THREE.CylinderGeometry(t, 1, 1, 10, 1);
      const mesh = new THREE.Mesh(geo, skinMat());
      this.group.add(mesh);
      this.bones.push(mesh);

      // Rim shell (slightly scaled up, backface only)
      const rim = new THREE.Mesh(geo, rimMat());
      rim.renderOrder = 1;
      this.group.add(rim);
      this.boneRims.push(rim);
    }

    // 21 joints — higher-poly sphere
    for (let i = 0; i < 21; i++) {
      const isTip = TIPS.has(i);
      const geo = new THREE.SphereGeometry(1, 10, 7);
      const mesh = new THREE.Mesh(geo, dotMat(isTip));
      this.group.add(mesh);
      this.joints.push(mesh);
    }

    // 23 skeleton lines
    for (let i = 0; i < CONN.length; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0,0,0,0], 3));
      const l = new THREE.Line(geo, lineMat());
      this.group.add(l);
      this.lines.push(l);
    }

    // 5 fingernails (at tip landmarks 4,8,12,16,20)
    for (let i = 0; i < 5; i++) {
      const mesh = new THREE.Mesh(buildNailGeo(), nailMat());
      this.group.add(mesh);
      this.nails.push(mesh);
    }

    // Palm — 14 triangles for fuller coverage including thumb base & wrist
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(14*3*3), 3));
    this.palmMesh = new THREE.Mesh(pg, palmMat());
    this.group.add(this.palmMesh);

    // Palm rim shell
    const pgr = new THREE.BufferGeometry();
    pgr.setAttribute('position', new THREE.BufferAttribute(new Float32Array(14*3*3), 3));
    this.palmRim = new THREE.Mesh(pgr, rimMat());
    this.palmRim.renderOrder = 1;
    this.group.add(this.palmRim);
  }

  update(lms, aspect, mirrorX) {
    if (!lms || lms.length < 21) { this.group.visible = false; return; }
    this.group.visible = true;

    const pts = lms.map(lm => {
      const nx = mirrorX ? (1 - lm.x) : lm.x;
      return new THREE.Vector3(
        (nx - 0.5) * 2 * aspect,
        -(lm.y - 0.5) * 2,
        -lm.z * 0.6
      );
    });

    // Track which 3D points are inferred for visual differentiation
    const isInferred = lms.map(lm => !!lm.inferred);

    const ref   = Math.max(pts[0].distanceTo(pts[9]), 0.01);
    const unitR = ref * 0.088;
    this._unitR = unitR;

    const showMesh = mode === 'mesh';
    const showWire = mode === 'wire';
    const showSkel = mode === 'skel';

    // Animated emissive pulse (subtle breathing effect)
    const pulse = 0.5 + 0.5 * Math.sin(matTime * 1.8);

    // ── Bones ──
    let bi = 0;
    for (const f of FINGERS) {
      for (let si = 1; si < f.c.length; si++) {
        const bone    = this.bones[bi];
        const boneRim = this.boneRims[bi];
        bi++;
        const a = pts[f.c[si-1]], b = pts[f.c[si]];
        const len = a.distanceTo(b);

        if (len < 0.001) {
          bone.visible = boneRim.visible = false;
          continue;
        }
        bone.visible    = showMesh || showWire;
        boneRim.visible = showMesh;

        const r2 = f.r[si-1] * unitR;
        bone.scale.set(r2, len, r2);
        boneRim.scale.set(r2 * 1.06, len * 1.01, r2 * 1.06);

        const mid = a.clone().lerp(b, 0.5);
        bone.position.copy(mid);
        boneRim.position.copy(mid);

        const dir = new THREE.Vector3().subVectors(b, a).normalize();
        const dot = dir.dot(UP);
        let q;
        if (Math.abs(dot) > 0.9999) {
          const tmp = new THREE.Quaternion(); tmp.set(0,0,dot<0?1:0,dot<0?0:1); tmp.normalize(); q = tmp;
        } else {
          q = new THREE.Quaternion().setFromUnitVectors(UP, dir);
        }
        bone.quaternion.copy(q);
        boneRim.quaternion.copy(q);

        bone.material.wireframe = showWire;
        bone.material.opacity   = showWire ? 0.45 : 0.92;
        // Subtle pulse on emissive; amber tint if either endpoint is inferred
        const boneInferred = isInferred[f.c[si-1]] || isInferred[f.c[si]];
        if (boneInferred && showMesh) {
          bone.material.color.setHex(0xcc6010);
          bone.material.emissive.setHex(0xff6000);
          bone.material.emissiveIntensity = 0.35 + pulse * 0.15;
          bone.material.opacity = 0.70;
        } else {
          bone.material.color.setHex(0xe8b89a);
          bone.material.emissive.setHex(0x00ffe5);
          bone.material.emissiveIntensity = showMesh ? 0.3 + pulse * 0.12 : 0;
          bone.material.opacity = showWire ? 0.45 : 0.92;
        }
      }
    }
    for (let i = bi; i < this.bones.length; i++) {
      this.bones[i].visible = this.boneRims[i].visible = false;
    }

    // ── Joints ──
    for (let i = 0; i < 21; i++) {
      const j = this.joints[i];
      j.visible = showSkel || (showMesh && (TIPS.has(i) || KNUCKLES.has(i)));
      j.position.copy(pts[i]);
      const isTip = TIPS.has(i), isK = KNUCKLES.has(i);
      const r = (isTip ? 1.30 : isK ? 1.10 : 0.85) * unitR;
      j.scale.setScalar(Math.max(r, 0.002));
      j.material.wireframe = showWire && showSkel;
      // Inferred landmarks: tint orange/amber to signal estimation
      if (isInferred[i]) {
        j.material.color.setHex(0xff9020);
        j.material.emissive.setHex(0xff6000);
        j.material.emissiveIntensity = 0.5 + pulse * 0.3;
        j.material.opacity = 0.6;
      } else if (isTip) {
        j.material.color.setHex(0x00ffe5);
        j.material.emissive.setHex(0x00ffe5);
        j.material.emissiveIntensity = 0.4 + pulse * 0.3;
        j.material.opacity = 1;
      } else {
        j.material.color.setHex(0x00ffe5);
        j.material.emissive.setHex(0x00ffe5);
        j.material.emissiveIntensity = 0;
        j.material.opacity = 1;
      }
    }

    // ── Lines ──
    for (let i = 0; i < CONN.length; i++) {
      const l = this.lines[i];
      const pa = l.geometry.attributes.position.array;
      const a = pts[CONN[i][0]], b = pts[CONN[i][1]];
      pa[0]=a.x; pa[1]=a.y; pa[2]=a.z;
      pa[3]=b.x; pa[4]=b.y; pa[5]=b.z;
      l.geometry.attributes.position.needsUpdate = true;
      l.visible = showSkel || showWire;
    }

    // ── Fingernails (5 tips: 4,8,12,16,20) ──
    const TIP_IDXS = [4, 8, 12, 16, 20];
    const PREV_IDXS= [3, 7, 11, 15, 19]; // one joint back for orientation
    for (let fi = 0; fi < 5; fi++) {
      const nail = this.nails[fi];
      nail.visible = showMesh;
      if (!showMesh) continue;

      const tip  = pts[TIP_IDXS[fi]];
      const prev = pts[PREV_IDXS[fi]];
      const dir  = new THREE.Vector3().subVectors(tip, prev).normalize();

      nail.position.copy(tip).addScaledVector(dir, unitR * 0.5);
      nail.scale.setScalar(unitR * 1.1);

      // Orient nail perpendicular to finger axis
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), dir);
      nail.quaternion.copy(q);
    }

    // ── Palm — 14 flat-shaded tris ──
    const ctr = new THREE.Vector3()
      .add(pts[0]).add(pts[5]).add(pts[9]).add(pts[13]).add(pts[17])
      .multiplyScalar(0.2);

    // Wrist midpoint
    const wrist = pts[0].clone();
    // Thumb base helper
    const tb = pts[1].clone();

    const palmTris = [
      // Core fan
      [ctr, pts[0],  pts[1] ],
      [ctr, pts[1],  pts[5] ],
      [ctr, pts[5],  pts[9] ],
      [ctr, pts[9],  pts[13]],
      [ctr, pts[13], pts[17]],
      [ctr, pts[17], pts[0] ],
      // Knuckle bridge triangles
      [pts[5],  pts[6],  pts[9] ],
      [pts[9],  pts[10], pts[13]],
      [pts[13], pts[14], pts[17]],
      // Thumb web
      [pts[1], pts[2],  pts[5] ],
      // Wrist pad
      [pts[0],  pts[17], pts[0].clone().lerp(pts[17], 0.5).lerp(wrist, 0.2)],
      // Fill outer palm edge
      [pts[5],  pts[9],  ctr   ],
      [pts[17], pts[0],  ctr   ],
      [pts[0],  pts[5],  ctr   ],
    ];

    const writeTris = (geo) => {
      const pa = geo.attributes.position.array;
      palmTris.forEach((tri, ti) => {
        tri.forEach((v, vi) => {
          pa[(ti*3+vi)*3+0] = v.x;
          pa[(ti*3+vi)*3+1] = v.y;
          pa[(ti*3+vi)*3+2] = v.z;
        });
      });
      geo.attributes.position.needsUpdate = true;
      geo.computeVertexNormals();
    };

    writeTris(this.palmMesh.geometry);
    writeTris(this.palmRim.geometry);

    this.palmMesh.visible = showMesh;
    this.palmRim.visible  = showMesh;
    this.palmMesh.material.emissiveIntensity = 0.2 + pulse * 0.1;

    return pts[8]; // torch anchor
  }

  hide() { this.group.visible = false; }
}

// ─── Render loop ──────────────────────────────────────────────────────────
// Decouple rendering from MediaPipe inference:
// Three.js runs at display refresh rate (rAF)
// MediaPipe runs as fast as it can separately
// → no frame drops from inference blocking render

let torchPos = new THREE.Vector3();
let torchVisible = false;

function animate() {
  requestAnimationFrame(animate);

  fc++;
  const now = performance.now();
  matTime = now * 0.001; // seconds, for pulse animation
  if (now - ft >= 1000) {
    fps = fc; fc = 0; ft = now;
    document.getElementById('perf').textContent =
      fps + ' fps · ' + inferenceMs.toFixed(0) + 'ms' + (isMobile ? ' · 1:'+INFER_EVERY : '');
  }

  const aspect  = window.innerWidth / window.innerHeight;

  // Smooth raw detector output → silky 60fps hand even at lower inference rate
  // Flicker rejection: only accept a new hand after PERSIST_MIN consecutive frames
  for (let hi = 0; hi < 2; hi++) {
    if (hi < rawHands.length) {
      handPersistCount[hi] = Math.min(handPersistCount[hi] + 1, PERSIST_MIN + 1);
    } else {
      handPersistCount[hi] = 0;
    }
  }

  const acceptedHands = rawHands.filter((_, hi) => handPersistCount[hi] >= PERSIST_MIN);

  if (acceptedHands.length > 0) {
    smoothHands = acceptedHands.map((lms, hi) =>
      smoothLandmarks(smoothHands[hi] || null, lms)
    );
    // Trim if fewer hands than before
    if (smoothHands.length > acceptedHands.length) smoothHands.length = acceptedHands.length;
    document.getElementById('status').className = 'panel on';
    document.getElementById('stxt').textContent  = 'Tracking';
    document.getElementById('hands').textContent = smoothHands.length + ' hand(s)';
  } else if (smoothHands.length > 0) {
    smoothHands = [];
    document.getElementById('status').className = 'panel';
    document.getElementById('stxt').textContent  = 'Scanning';
    document.getElementById('hands').textContent = '0 hand(s)';
  }
  const mirrorX = (facingMode === 'user');

  torchVisible = false;
  for (let i = 0; i < 2; i++) {
    if (i < smoothHands.length) {
      const tip = HR[i].update(smoothHands[i], aspect, mirrorX);
      if (tip && i === 0) { torchPos.copy(tip); torchVisible = true; }
    } else {
      HR[i].hide();
    }
  }

  // ── Depth / contrast / position HUD (first hand only for perf) ──
  updateDepthHUD(smoothHands[0] || null);
  // ── Occlusion overlay badges ──
  updateOcclusionOverlay(smoothHands, mirrorX);

  // Torch update
  if (torchOn && torchVisible) {
    torchLight.position.copy(torchPos);
    torchLight.intensity = 2.2;
    torchGlowMesh.position.copy(torchPos);
    torchGlowMat.opacity = 0.65;
    document.getElementById('torch-indicator').className = 'on';
  } else {
    torchLight.intensity = 0;
    torchGlowMat.opacity = 0;
    document.getElementById('torch-indicator').className = '';
  }

  R.render(scene, CAM);
}

import { HandLandmarker, FilesetResolver }
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs';

const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm';
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

async function initDetector() {
  const lfill = document.getElementById('lfill');
  const ltxt  = document.getElementById('ltxt');
  lfill.style.width = '20%';
  ltxt.textContent = 'Loading WASM…';

    detector = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: MODEL_URL,
        delegate: 'GPU',
      },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.25,   // lower → palm detector fires more readily
      minHandPresenceConfidence: 0.35,    // lower → keeps tracking through occlusions
      minTrackingConfidence: 0.25,        // lower → fewer expensive re-detections
    });

    lfill.style.width = '100%';
    ltxt.textContent = 'Ready';
    detectorReady = true;
    setTimeout(() => {
      document.getElementById('lbar').style.display = 'none';

  }

// ─── Inference loop — MediaPipe detectForVideo ────────────────────────────
// detectForVideo is synchronous — throttle on mobile to protect rAF budget
let lastVideoTime = -1;
let inferenceFrameCount = 0;
const INFER_EVERY = isMobile ? 2 : 1; // run inference every N frames

function inferenceLoop() {
  requestAnimationFrame(inferenceLoop);
  if (!detectorReady || !detector || !video.videoWidth) return;

  inferenceFrameCount++;
  if (inferenceFrameCount % INFER_EVERY !== 0) return; // throttle on mobile

  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const t0 = performance.now();
  try {
    const result = detector.detectForVideo(video, performance.now());
    if (result && result.landmarks && result.landmarks.length > 0) {
      rawHands = result.landmarks.map((lms, hi) => {
        const wlms = result.worldLandmarks[hi] || [];
        const baseLms = lms.map((lm, i) => {
          const wz = wlms[i] ? wlms[i].z : 0;
          // Blend: world z (metric) for gross depth, image z for fine detail
          // worldLandmarks z in metres; scale to scene units and blend
          const blendedZ = wz * 2.8;
          return {
            x: lm.x,
            y: lm.y,
            z: blendedZ,
          };
        });
        // Apply occlusion inference: detect hidden landmarks and fill with FK estimates
        const { lms: inferredLms, occNames } = applyOcclusionInference(baseLms);
        // Temporal smoothing of inferred positions
        const blended = blendInferredLandmarks(_prevInferredLms[hi], inferredLms);
        _prevInferredLms[hi] = blended;
        return blended;
      });
    } else {
      rawHands = [];
    }
  } catch(e) { rawHands = []; }
  inferenceMs = performance.now() - t0;
}

inferenceLoop(); // start immediately; camera start triggers actual detection

async function startCamera(facing) {
  facingMode = facing || 'user';

  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }

  document.getElementById('stxt').textContent = 'Requesting…';
  const ltxt = document.getElementById('ltxt');

  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode,
        width:     { ideal: isMobile ? 640 : 1280 },
        height:    { ideal: isMobile ? 480 : 720  },
        frameRate: { ideal: isMobile ? 30  : 60   },
      },
      audio: false,
    });
  } catch(err) {
    document.getElementById('stxt').textContent = 'Denied';
    ltxt.textContent = err.name === 'NotAllowedError'
      ? 'Camera denied. Allow in browser settings, then reload.'
      : 'Camera error: ' + err.message;
    ltxt.style.display = 'block';
    const b = document.getElementById('start-btn');
    b.textContent = 'Retry'; b.style.display = 'block';
    return;
  }

  video.srcObject = camStream;
  await new Promise(res => { video.onloadedmetadata = res; });
  await video.play();

  activeCameraTrack = camStream.getVideoTracks()[0] || null;
  applyHardwareTorch(torchOn);

  document.getElementById('splash').style.opacity = '0';
  setTimeout(() => document.getElementById('splash').style.display='none', 500);
  document.getElementById('stxt').textContent = 'Scanning';
}

// ─── Personalised model storage ───────────────────────────────────────────
// Stores per-segment bone lengths derived from scan, applied to HandRenderer
let personalModel = null;

try {

  if (saved) personalModel = JSON.parse(saved);

// Finger segment pairs: [proximal_idx, distal_idx] for each phalanx
const SEG_PAIRS = [
  // thumb
  [1,2],[2,3],[3,4],
  // index
  [5,6],[6,7],[7,8],
  // middle
  [9,10],[10,11],[11,12],
  // ring
  [13,14],[14,15],[15,16],
  // pinky
  [17,18],[18,19],[19,20],
];

function lmDist(a, b) {
  const dx = a.x-b.x, dy = a.y-b.y, dz = a.z-b.z;
  return Math.sqrt(dx*dx+dy*dy+dz*dz);
}

// Extract bone length ratios relative to palm diagonal (lm0→lm9)
function extractBoneRatios(lms) {
  const palmRef = Math.max(lmDist(lms[0], lms[9]), 1e-6);
  return SEG_PAIRS.map(([a,b]) => lmDist(lms[a], lms[b]) / palmRef);
}

// Apply personalModel radii to HandRenderer bones
// We scale taper radii proportional to segment length ratios
function applyPersonalModel(hr, ratios) {
  if (!ratios || ratios.length !== SEG_PAIRS.length) return;
  // Map ratios back into FINGERS r[] arrays
  // SEG_PAIRS order: thumb(3), index(3), middle(3), ring(3), pinky(3)
  let ri = 0;
  for (let fi = 0; fi < FINGERS.length; fi++) {
    const f = FINGERS[fi];
    for (let si = 1; si < f.c.length; si++) {
      // Scale radius proportionally to measured ratio vs default
      const measuredRatio = ratios[ri] || 1;
      // Keep original taper shape but scale overall thickness
      // Clamp to [0.6, 1.6] × original to avoid degenerate shapes
      const scale = Math.max(0.6, Math.min(1.6, measuredRatio * 4.5));
      hr.bones[ri].geometry.dispose();
      const t = [0.75,0.80,0.82,0.85, 0.80,0.82,0.84,0.86, 0.80,0.82,0.84,0.86, 0.80,0.82,0.84,0.86, 0.78,0.80,0.82,0.85][ri] || 0.82;
      hr.bones[ri].geometry = new THREE.CylinderGeometry(t, 1, 1, 6, 1);
      ri++;
    }
  }
}

// ─── 3D Scanner ───────────────────────────────────────────────────────────
// Motion detection helpers
// fingerCurl: 0=open, 1=closed. Measures tip-to-palm distance normalized by palm size
function fingerCurl(lms) {
  const palmRef = Math.max(lmDist(lms[0], lms[9]), 1e-6);
  const tips = [4,8,12,16,20];
  return tips.map(ti => {
    const d = lmDist(lms[ti], lms[0]);
    return 1 - Math.min(1, d / (palmRef * 1.8));
  });
}

// Spread: average angle between adjacent fingers
function fingerSpread(lms) {
  const bases = [5,9,13,17];
  let sumAngle = 0;
  for (let i = 0; i < bases.length - 1; i++) {
    const a = lms[bases[i]], b = lms[bases[i+1]], o = lms[0];
    const va = {x:a.x-o.x, y:a.y-o.y};
    const vb = {x:b.x-o.x, y:b.y-o.y};
    const dot = va.x*vb.x + va.y*vb.y;
    const mag = Math.sqrt((va.x**2+va.y**2)*(vb.x**2+vb.y**2));
    sumAngle += mag > 0 ? Math.acos(Math.max(-1,Math.min(1, dot/mag))) : 0;
  }
  return sumAngle / (bases.length - 1); // radians
}

// Wrist roll: z-tilt of the hand (palm normal dot vertical)
function wristRoll(lms) {
  // Use vector from wrist(0) to index-knuckle(5) and middle-knuckle(9)
  const vy = {x: lms[9].x - lms[0].x, y: lms[9].y - lms[0].y};
  const len = Math.sqrt(vy.x**2 + vy.y**2);
  if (len < 1e-6) return 0;
  // angle with vertical axis (positive y = down in image coords)
  return Math.atan2(vy.x, -vy.y); // -pi..pi, 0 = fingers pointing up
}

  // ── 3. MOTION: Open → Close (3 reps) ────────────────────────────────────
  {
    name: 'Open ↔ Close',
    instruction: 'Open and close your fist 3 times slowly',
    duration: 10000,
    captureDuration: 1500,
    isMotion: true,
    // Motion state: count transitions between open and closed
    _state: { phase: 'open', reps: 0, lastCurl: 0 },
    motionTarget: 3, // need 3 open-close reps
    motionLabel: 'reps',
    validate(lms) { return !!lms; },
    // Returns [0..1] progress
    motionProgress(lms) {
      if (!lms) return 0;
      const curl = fingerCurl(lms);
      const avgCurl = (curl[1]+curl[2]+curl[3]+curl[4]) / 4; // skip thumb
      const s = this._state;
      if (s.phase === 'open'  && avgCurl > 0.65) { s.phase = 'closed'; }
      if (s.phase === 'closed'&& avgCurl < 0.30) { s.phase = 'open'; s.reps++; }
      return Math.min(1, s.reps / this.motionTarget);
    },
    resetMotion() { this._state = { phase: 'open', reps: 0, lastCurl: 0 }; },
    silPath: `<path d="M38 95 Q30 80 30 65 L30 42 Q30 36 36 36 Q42 36 42 42 L42 38 Q42 32 48 32 Q54 32 54 38 L54 36 Q54 30 60 30 Q66 30 66 36 L66 38 Q66 32 72 32 Q78 32 78 38 L78 65 Q78 75 82 85 Q86 95 80 100 Q60 108 40 100 Z" stroke="rgba(255,200,80,.9)" stroke-width="1.4" fill="none"/>
    <path d="M35 65 Q33 50 38 42 Q50 38 72 38 Q82 42 82 55 Q82 70 78 80 Q72 92 60 94 Q45 94 38 85 Q34 78 35 65 Z" stroke="rgba(255,200,80,.5)" stroke-width="1" fill="none" stroke-dasharray="4 3"/>`,
  },

  // ── 4. MOTION: Wave fingers (ripple each finger) ─────────────────────────
  {
    name: 'Finger Wave',
    instruction: 'Bend each finger one by one from index to pinky',
    duration: 10000,
    captureDuration: 1500,
    isMotion: true,
    _state: { fingersDone: new Set(), lastCurlArr: [0,0,0,0], activeIdx: -1 },
    motionTarget: 4, // 4 fingers (index→pinky)
    motionLabel: 'fingers',
    validate(lms) { return !!lms; },
    motionProgress(lms) {
      if (!lms) return 0;
      const curl = fingerCurl(lms);
      const s = this._state;
      // Index=1,Middle=2,Ring=3,Pinky=4 in tips array
      for (let fi = 0; fi < 4; fi++) {
        const c = curl[fi + 1]; // skip thumb
        if (c > 0.7 && !s.fingersDone.has(fi)) {
          s.fingersDone.add(fi);
        }
      }
      return Math.min(1, s.fingersDone.size / this.motionTarget);
    },
    resetMotion() { this._state = { fingersDone: new Set(), lastCurlArr: [0,0,0,0], activeIdx: -1 }; },
    silPath: `<path d="M38 95 Q30 80 30 70 L30 50 Q30 44 35 44 Q40 44 42 50 L42 48 Q42 40 48 40 Q54 40 54 48 L54 46 Q54 38 60 38 Q66 38 66 46 L66 50 Q66 42 72 42 Q78 42 78 50 L78 70 Q78 80 70 90 L50 95 Z" stroke="rgba(255,200,80,.9)" stroke-width="1.4" fill="none"/>
    <path d="M42 50 L42 88" stroke="rgba(255,200,80,.35)" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M54 48 L54 88" stroke="rgba(255,200,80,.55)" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M66 46 L66 88" stroke="rgba(255,200,80,.75)" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M78 50 L78 88" stroke="rgba(255,200,80,.9)" stroke-width="1" stroke-dasharray="2 3"/>`,
  },

  // ── 5. MOTION: Wrist rotate (roll palm face ↔ back) ─────────────────────
  {
    name: 'Wrist Rotate',
    instruction: 'Rotate wrist: show palm then back, repeat 2×',
    duration: 10000,
    captureDuration: 1500,
    isMotion: true,
    _state: { phase: 'front', reps: 0 },
    motionTarget: 2,
    motionLabel: 'rotations',
    validate(lms) { return !!lms; },
    motionProgress(lms) {
      if (!lms) return 0;
      // Use z-depth of fingertips vs wrist to infer facing
      // When back of hand faces camera, fingertip z > wrist z (farther from cam)
      const wz = lms[0].z;
      const avgTipZ = (lms[8].z + lms[12].z + lms[16].z) / 3;
      const facing = (avgTipZ - wz) > 0.01 ? 'back' : 'front';
      const s = this._state;
      if (s.phase === 'front' && facing === 'back') { s.phase = 'back'; }
      if (s.phase === 'back'  && facing === 'front') { s.phase = 'front'; s.reps++; }
      return Math.min(1, s.reps / this.motionTarget);
    },
    resetMotion() { this._state = { phase: 'front', reps: 0 }; },
    silPath: `<path d="M38 95 Q30 80 30 65 L30 42 Q30 36 36 36 Q42 36 42 42 L42 38 Q42 32 48 32 Q54 32 54 38 L54 36 Q54 30 60 30 Q66 30 66 36 L66 38 Q66 32 72 32 Q78 32 78 38 L78 65 Q78 75 82 85 Q86 95 80 100 Q60 108 40 100 Z" stroke="rgba(255,200,80,.9)" stroke-width="1.4" fill="rgba(255,200,80,.04)"/>
    <path d="M85 60 Q95 60 95 70 Q95 80 85 80" stroke="rgba(255,200,80,.6)" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>
    <path d="M90 65 L87 58 M90 65 L97 63" stroke="rgba(255,200,80,.8)" stroke-width="1.2"/>`,
  },

  // ── 6. MOTION: Individual finger independence ────────────────────────────
  {
    name: 'Thumb Wave',
    instruction: 'Bend and extend your thumb 3 times',
    duration: 10000,
    captureDuration: 1500,
    isMotion: true,
    _state: { phase: 'open', reps: 0 },
    motionTarget: 3,
    motionLabel: 'reps',
    validate(lms) { return !!lms; },
    motionProgress(lms) {
      if (!lms) return 0;
      const curl = fingerCurl(lms);
      const thumbCurl = curl[0];
      const s = this._state;
      if (s.phase === 'open'  && thumbCurl > 0.60) { s.phase = 'closed'; }
      if (s.phase === 'closed'&& thumbCurl < 0.25) { s.phase = 'open'; s.reps++; }
      return Math.min(1, s.reps / this.motionTarget);
    },
    resetMotion() { this._state = { phase: 'open', reps: 0 }; },
    silPath: `<path d="M38 95 Q30 80 30 65 L30 42 Q30 36 36 36 Q42 36 42 42 L42 38 Q42 32 48 32 Q54 32 54 38 L54 36 Q54 30 60 30 Q66 30 66 36 L66 38 Q66 32 72 32 Q78 32 78 38 L78 65 Q78 75 82 85 Q86 95 80 100 Q60 108 40 100 Z" stroke="rgba(0,255,229,.4)" stroke-width="1" fill="none"/>
    <path d="M30 65 Q22 60 20 50 Q18 38 28 34 Q36 32 42 42" stroke="rgba(255,200,80,.9)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
  },

  // ── 7. Side view left ─────────────────────────────────────────────────────
  {
    name: 'Side View',
    instruction: 'Rotate 90° · thumb pointing up · hold steady',
    duration: 10000,
    captureDuration: 1500,
    isMotion: false,
    validate(lms) {
      if (!lms) return false;
      const roll = Math.abs(wristRoll(lms));
      return roll > 0.8 && roll < 2.3; // roughly 45°–135° from vertical
    },
    motionTarget: null,
    silPath: `<path d="M55 30 L55 95 Q55 105 60 105 Q65 105 65 95 L65 30 Q65 22 60 20 Q55 22 55 30 Z" stroke="rgba(0,255,229,.9)" stroke-width="1.4" fill="none"/><path d="M60 30 Q80 35 82 50 Q84 65 60 68" stroke="rgba(0,255,229,.5)" stroke-width="1" fill="none"/>`,
  },

  // ── 8. Fist final capture ────────────────────────────────────────────────
  {
    name: 'Closed Fist',
    instruction: 'Make a tight fist · hold steady',
    duration: 10000,
    captureDuration: 1500,
    isMotion: false,
    validate(lms) {
      if (!lms) return false;
      const curl = fingerCurl(lms);
      const avg = (curl[1]+curl[2]+curl[3]+curl[4]) / 4;
      return avg > 0.55;
    },
    motionTarget: null,
    silPath: `<path d="M35 65 Q33 50 38 42 Q50 38 72 38 Q82 42 82 55 Q82 70 78 80 Q72 92 60 94 Q45 94 38 85 Q34 78 35 65 Z" stroke="rgba(0,255,229,.9)" stroke-width="1.4" fill="none"/><path d="M38 58 Q55 55 82 58" stroke="rgba(0,255,229,.4)" stroke-width="1"/><path d="M40 68 Q55 65 80 68" stroke="rgba(0,255,229,.4)" stroke-width="1"/>`,
  },
];

const SCANNER = {
  active: false,
  poseIdx: 0,
  phase: 'idle', // idle | countdown | capturing | done
  phaseStart: 0,
  poseCaptures: [], // per-pose: array of landmark-sets (one entry per detected hand per frame)
  allCaptures: [],  // flat: averaged pose landmark sets
  rafId: null,
  qualityHistory: [],
  motionProg: 0,    // current motion pose progress [0..1]

  // Quality: checks any detected hand has good spread, PLUS contrast + depth + position
  computeQuality() {
    if (!smoothHands.length) return 0;
    // Use best hand (highest spread)
    let best = 0;
    for (const lms of smoothHands) {
      const spread = lmDist(lms[0], lms[12]);
      const spreadQ = Math.min(1, spread / 0.22);
      if (spreadQ > best) best = spreadQ;
    }

    // Incorporate contrast and depth from the analysis engine
    // (already computed and smoothed every 200ms)
    const contrastFactor = 0.7 + _contrastSmooth.contrast * 0.3;    // 0.7..1.0
    const depthFactor    = 0.75 + _contrastSmooth.depth    * 0.25;   // 0.75..1.0
    const positionFactor = 0.7  + _contrastSmooth.position * 0.3;    // 0.7..1.0

    return Math.min(1, best * contrastFactor * depthFactor * positionFactor);
  },

  start() {
    if (this.active) return;
    this.active = true;
    this.poseIdx = 0;
    this.poseCaptures = [];
    this.allCaptures = [];
    this.qualityHistory = [];
    this.motionProg = 0;
    this._pausedTime = 0;  // total ms paused due to low quality
    this._paused = false;
    this._maxHands = 0;
    document.getElementById('scan-overlay').classList.add('active');
    document.getElementById('bscan').classList.add('scanning');
    document.getElementById('bscan').textContent = '…';
    this.startPose(0);
  },

  stop(completed) {
    this.active = false;
    this.phase = 'idle';
    document.getElementById('scan-overlay').classList.remove('active');
    document.getElementById('bscan').classList.remove('scanning');
    document.getElementById('bscan').textContent = completed ? 'Rescan' : 'Scan';
    document.getElementById('bscan').classList.toggle('done', !!completed);
    if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
  },

  startPose(idx) {
    this.poseIdx = idx;
    this.phase = 'countdown';
    this.phaseStart = performance.now();
    this.poseCaptures[idx] = [];
    this.motionProg = 0;
    this._pausedTime = 0;
    this._paused = false;
    this._pauseStart = 0;

    const pose = SCAN_POSES[idx];
    if (pose.isMotion && typeof pose.resetMotion === 'function') pose.resetMotion();

    // Fade-in silhouette animation
    const sil = document.getElementById('scan-sil');
    sil.style.transition = 'opacity 0.35s';
    sil.style.opacity = '0';
    setTimeout(() => {
      sil.innerHTML = pose.silPath;
      sil.style.opacity = '1';
    }, 200);

    document.getElementById('scan-pose-name').textContent = pose.name;
    document.getElementById('scan-instruction').textContent = pose.instruction;

    const motionRow = document.getElementById('scan-motion-row');
    if (pose.isMotion) {
      motionRow.style.display = 'flex';
      document.getElementById('scan-motion-fill').style.width = '0%';
      document.getElementById('scan-motion-txt').textContent = '';
    } else {
      motionRow.style.display = 'none';
    }

    for (let i = 0; i < SCAN_POSES.length; i++) {
      const d = document.getElementById('sdot-'+i);
      if (d) d.className = 'sdot' + (i < idx ? ' done' : i === idx ? ' active' : '');
    }

    const arc = document.getElementById('scan-countdown-arc');
    arc.style.strokeDashoffset = '163';
    arc.style.stroke = pose.isMotion ? 'rgba(255,200,80,.9)' : 'rgba(0,255,229,.9)';

    this.tick();
  },

  tick() {
    if (!this.active) return;
    this.rafId = requestAnimationFrame(() => this.tick());

    const pose = SCAN_POSES[this.poseIdx];
    const now = performance.now();

    // Quality (uses best hand)
    const q = this.computeQuality();
    this.qualityHistory.push(q);
    if (this.qualityHistory.length > 12) this.qualityHistory.shift();
    const avgQ = this.qualityHistory.reduce((a,b)=>a+b,0) / this.qualityHistory.length;
    document.getElementById('scan-quality-fill').style.width = (avgQ * 100) + '%';

    // Track max simultaneous hands detected
    if (smoothHands.length > this._maxHands) this._maxHands = smoothHands.length;

    const primaryLms = smoothHands.length > 0 ? smoothHands[0] : null;

    // Quality gating: pause countdown when signal < 30%
    if (this.phase === 'countdown') {
      const lowSignal = avgQ < 0.28 && this.qualityHistory.length >= 6;
      if (lowSignal && !this._paused) {
        this._paused = true;
        this._pauseStart = now;
        document.getElementById('scan-instruction').textContent = '⚠ Move hand into frame…';
      } else if (!lowSignal && this._paused) {
        this._paused = false;
        this._pausedTime += now - this._pauseStart;
        document.getElementById('scan-instruction').textContent = pose.instruction;
      }
      if (this._paused) {
        // Still tick visuals but don't advance elapsed
        document.getElementById('scan-countdown-arc').style.stroke = 'rgba(255,64,96,.6)';
        return;
      }
    }

    const elapsed = (now - this.phaseStart) - this._pausedTime;

    if (this.phase === 'countdown') {
      const total = pose.duration;
      const remaining = Math.max(0, total - elapsed);
      const secs = Math.ceil(remaining / 1000);

      if (pose.isMotion && typeof pose.motionProgress === 'function') {
        const mp = pose.motionProgress(primaryLms);
        this.motionProg = mp;
        document.getElementById('scan-motion-fill').style.width = (mp * 100) + '%';
        const done = Math.round(mp * pose.motionTarget);
        document.getElementById('scan-motion-txt').textContent =
          done + ' / ' + pose.motionTarget + ' ' + (pose.motionLabel || '');
        const arc2 = document.getElementById('scan-countdown-arc');
        arc2.style.stroke = mp >= 1 ? 'rgba(0,255,229,.9)' : 'rgba(255,200,80,.9)';
        if (mp >= 1 && !this._motionUnlocked) {
          this._motionUnlocked = true;
          document.getElementById('scan-instruction').textContent = '✓ Motion complete · hold still…';
        }
      } else {
        const valid = pose.validate ? pose.validate(primaryLms) : !!primaryLms;
        const arc2 = document.getElementById('scan-countdown-arc');
        arc2.style.stroke = valid ? 'rgba(0,255,229,.9)' : 'rgba(255,140,40,.8)';
      }

      const arc = document.getElementById('scan-countdown-arc');
      const frac = elapsed / total;
      arc.style.strokeDashoffset = (163 * (1 - frac)).toFixed(2);
      document.getElementById('scan-countdown-num').textContent = secs;

      const outerArc = document.getElementById('scan-arc');
      outerArc.style.strokeDashoffset = (729 * (1 - frac)).toFixed(2);

      if (elapsed >= total) {
        this.phase = 'capturing';
        this._motionUnlocked = false;
        this.phaseStart = performance.now();
        this._pausedTime = 0;
        this._paused = false;
        document.getElementById('scan-instruction').textContent = '● Capturing…';
        document.getElementById('scan-motion-row').style.display = 'none';
      }

    } else if (this.phase === 'capturing') {
      const capDur = pose.captureDuration;
      const capElapsed = now - this.phaseStart;

      // Only capture frames with sufficient quality
      if (smoothHands.length > 0 && q > 0.25) {
        smoothHands.forEach(lms => {
          this.poseCaptures[this.poseIdx].push(
            lms.map(l => ({x:l.x, y:l.y, z:l.z}))
          );
        });
      }

      document.getElementById('scan-countdown-num').textContent = '✦';

      if (capElapsed >= capDur) {
        this.finishPose();
      }
    }
  },

  finishPose() {
    const frames = this.poseCaptures[this.poseIdx];
    if (frames.length > 0) {
      // Average all captured frames for this pose → single clean landmark set per pose
      const avg = Array.from({length:21}, (_,i) => {
        const sx = frames.reduce((s,f)=>s+f[i].x, 0) / frames.length;
        const sy = frames.reduce((s,f)=>s+f[i].y, 0) / frames.length;
        const sz = frames.reduce((s,f)=>s+f[i].z, 0) / frames.length;
        return {x:sx, y:sy, z:sz};
      });
      this.allCaptures.push(avg);
    }

    const next = this.poseIdx + 1;
    if (next < SCAN_POSES.length) {
      this.startPose(next);
    } else {
      this.complete();
    }
  },

  complete() {
    this.phase = 'done';
    // Mark all dots done
    for (let i = 0; i < SCAN_POSES.length; i++) {
      document.getElementById('sdot-'+i).className = 'sdot done';
    }
    document.getElementById('scan-countdown-num').textContent = '✓';
    document.getElementById('scan-instruction').textContent = 'Processing…';

    setTimeout(() => {
      this.stop(true);
      this.buildModel();
    }, 600);
  },

  buildModel() {
    if (!this.allCaptures.length) return;

    // ── 1. Extract bone ratios from each pose capture, average them
    const ratioSets = this.allCaptures.map(lms => extractBoneRatios(lms));
    const avgRatios = ratioSets[0].map((_, ri) =>
      ratioSets.reduce((s, rs) => s + rs[ri], 0) / ratioSets.length
    );

    // ── 2. Build unified point cloud
    // For each pose, project landmarks into world space (reusing update math)
    const aspect = window.innerWidth / window.innerHeight;
    const mirrorX = (facingMode === 'user');
    cloudPoints = [];

    this.allCaptures.forEach(lms => {
      lms.forEach(lm => {
        const nx = mirrorX ? (1 - lm.x) : lm.x;
        cloudPoints.push({
          x: (nx - 0.5) * 2 * aspect,
          y: -(lm.y - 0.5) * 2,
          z: -lm.z * 0.6,
        });
      });
    });

    // Add interpolated points between connected landmarks for denser cloud
    // 9 interpolation steps per bone segment
    this.allCaptures.forEach(lms => {
      CONN.forEach(([ai, bi]) => {
        const a = lms[ai], b = lms[bi];
        for (let t = 0.1; t < 1.0; t += 0.1) {
          const nx = mirrorX ? (1 - (a.x + (b.x-a.x)*t)) : (a.x + (b.x-a.x)*t);
          cloudPoints.push({
            x: (nx - 0.5) * 2 * aspect,
            y: -((a.y + (b.y-a.y)*t) - 0.5) * 2,
            z: -((a.z + (b.z-a.z)*t)) * 0.6,
          });
        }
      });
    });

    updateCloudMesh();

    // ── 3. Compute display metrics
    // Finger length ratios (relative to index finger = 1.0)
    const FINGER_NAMES = ['Thumb','Index','Middle','Ring','Pinky'];
    // Sum 3 segs per finger
    const fingerLengths = [0,1,2,3,4].map(fi => {
      const base = fi * 3;
      return avgRatios.slice(base, base+3).reduce((s,v)=>s+v, 0);
    });
    const indexLen = fingerLengths[1] || 1;
    const metrics = FINGER_NAMES.map((n,i) => ({
      name: n,
      ratio: (fingerLengths[i] / indexLen).toFixed(3),
    }));

    // ── 4. Save + show result
    personalModel = { ratios: avgRatios, metrics, cloudCount: cloudPoints.length };
    try { localStorage.setItem('hand_scan_v1', JSON.stringify(personalModel)); } catch(e){}

    const metricsEl = document.getElementById('scan-metrics');
    metricsEl.innerHTML = metrics.map(m =>
      `<div class="smet"><span class="smet-label">${m.name}</span><span class="smet-val">${m.ratio}×</span></div>`
    ).join('') +
    `<div class="smet"><span class="smet-label">Cloud pts</span><span class="smet-val">${cloudPoints.length}</span></div>` +
    `<div class="smet"><span class="smet-label">Hands det.</span><span class="smet-val">${this._maxHands}</span></div>` +
    `<div class="smet"><span class="smet-label">Poses</span><span class="smet-val">${this.allCaptures.length}</span></div>`;

    document.getElementById('scan-result').classList.add('active');
  },
};

document.getElementById('sr-discard').addEventListener('click', () => {
  document.getElementById('scan-result').classList.remove('active');
  cloudPoints = [];
  updateCloudMesh();
  personalModel = null;
  try { localStorage.removeItem('hand_scan_v1'); } catch(e){}
});

document.getElementById('sr-apply').addEventListener('click', () => {
  document.getElementById('scan-result').classList.remove('active');
  // Enable cloud view automatically
  showCloud = true;
  document.getElementById('bcloud').classList.add('on');
  cloudMesh.visible = true;
  document.getElementById('cloud-badge').className = 'on';
});

document.getElementById('scan-cancel').addEventListener('click', () => {
  SCANNER.stop(false);
});

document.getElementById('bscan').addEventListener('click', () => {
  if (SCANNER.active) {
    SCANNER.stop(false);
  } else {
    SCANNER.start();
  }
});

// ─── White screen light source ───────────────────────────────────────────
const whiteScreen = document.getElementById('white-screen');
document.getElementById('bwhite').addEventListener('click', () => {
  const on = whiteScreen.classList.toggle('active');
  document.getElementById('bwhite').classList.toggle('on', on);
  // Keep screen awake while white screen is on (where supported)
  if (on && navigator.wakeLock) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
});
// Tap white screen to dismiss
whiteScreen.addEventListener('click', () => {
  whiteScreen.classList.remove('active');
  document.getElementById('bwhite').classList.remove('on');
});

// Boot
initDetector();
</script>
