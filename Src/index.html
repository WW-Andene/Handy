<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Hand 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --plasma:#00ffe5;--warn:#ff4060;
    --ui:#0a0d12;--ui-b:rgba(10,13,18,.82);
    --font:'JetBrains Mono','Fira Mono',monospace;
  }
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--plasma);}
  #cam{position:fixed;top:-9999px;left:-9999px;width:320px;height:240px;opacity:0;pointer-events:none;}
  #gl{position:fixed;inset:0;width:100%!important;height:100%!important;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #hud::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.035) 2px,rgba(0,0,0,.035) 4px);pointer-events:none;}

  .panel{background:var(--ui-b);border:1px solid rgba(0,255,229,.22);border-radius:5px;backdrop-filter:blur(10px);}

  #status{position:absolute;top:16px;left:16px;padding:6px 11px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
  #status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:7px;vertical-align:middle;transition:background .3s;}
  #status.on .dot{background:var(--plasma);}
  #status.on{border-color:rgba(0,255,229,.5);}

  #perf{position:absolute;top:16px;right:16px;padding:4px 8px;font-size:10px;letter-spacing:.08em;color:rgba(0,255,229,.55);}
  #hands{position:absolute;top:46px;right:16px;padding:4px 8px;font-size:10px;letter-spacing:.08em;color:rgba(0,255,229,.55);}

  #info{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(0,255,229,.28);white-space:nowrap;}

  #ctrl{position:absolute;bottom:56px;right:16px;pointer-events:all;display:flex;flex-direction:column;gap:5px;}
  .cb{background:var(--ui-b);border:1px solid rgba(0,255,229,.2);color:rgba(0,255,229,.5);font-family:var(--font);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;cursor:pointer;border-radius:3px;transition:all .18s;backdrop-filter:blur(8px);text-align:center;min-width:54px;}
  .cb.on{border-color:var(--plasma);color:var(--plasma);background:rgba(0,255,229,.1);}
  .cb:active{transform:scale(.95);}
  .sep{height:1px;background:rgba(0,255,229,.1);margin:2px 0;}

  /* Torch glow indicator */
  #torch-indicator{position:absolute;top:76px;right:16px;padding:4px 8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,200,80,.0);transition:color .3s;}
  #torch-indicator.on{color:rgba(255,200,80,.8);}

  /* Splash */
  #splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s;}
  #splash h1{font-size:clamp(20px,5vw,32px);letter-spacing:.22em;text-transform:uppercase;color:var(--plasma);text-shadow:0 0 28px rgba(0,255,229,.45);}
  #splash p{font-size:11px;letter-spacing:.12em;color:rgba(0,255,229,.45);text-align:center;max-width:270px;line-height:1.9;}
  #start-btn{background:transparent;border:1px solid var(--plasma);color:var(--plasma);font-family:var(--font);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:11px 26px;cursor:pointer;border-radius:2px;transition:all .2s;}
  #start-btn:active{background:rgba(0,255,229,.12);}
  #lbar{width:190px;height:1px;background:rgba(0,255,229,.13);border-radius:1px;overflow:hidden;}
  #lfill{height:100%;background:var(--plasma);width:0%;transition:width .28s;box-shadow:0 0 7px var(--plasma);}
  #ltxt{font-size:10px;letter-spacing:.15em;color:rgba(0,255,229,.38);}
</style>
</head>
<body>
<video id="cam" playsinline autoplay muted width="320" height="240"></video>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="status" class="panel"><span class="dot"></span><span id="stxt">Initializing</span></div>
  <div id="perf" class="panel">-- fps · -- ms</div>
  <div id="hands" class="panel">0 hand(s)</div>
  <div id="torch-indicator">⚡ Torch</div>
  <div id="info">Show hand to camera</div>
  <div id="ctrl">
    <button class="cb on" id="bm">Mesh</button>
    <button class="cb" id="bw">Wire</button>
    <button class="cb" id="bs">Skel</button>
    <div class="sep"></div>
    <button class="cb on" id="bt">Torch</button>
    <div class="sep"></div>
    <button class="cb" id="bc">↺ Cam</button>
  </div>
</div>

<div id="splash">
  <h1>AR Hand 3D</h1>
  <p>Anatomical hand model<br>Camera = detection only</p>
  <div id="lbar"><div id="lfill"></div></div>
  <div id="ltxt">Loading…</div>
  <button id="start-btn" style="display:none">Start</button>
</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- TF.js + HandPose (WebGL GPU inference) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.9.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@3.9.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@3.9.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.0/dist/hand-pose-detection.min.js"></script>

<script>
'use strict';

// ─── Skeleton topology ────────────────────────────────────────────────────
const CONN = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

// Per-segment taper radii (relative, scaled at runtime)
const FINGERS = [
  {c:[0,1,2,3,4],   r:[.38,.30,.26,.22,.18]}, // thumb
  {c:[0,5,6,7,8],   r:[.32,.32,.27,.23,.18]}, // index
  {c:[0,9,10,11,12],r:[.32,.34,.28,.24,.19]}, // middle
  {c:[0,13,14,15,16],r:[.30,.30,.26,.22,.18]}, // ring
  {c:[0,17,18,19,20],r:[.26,.24,.20,.17,.14]}, // pinky
];
const TIPS = new Set([4,8,12,16,20]);
const KNUCKLES = new Set([5,9,13,17]);

// ─── State ────────────────────────────────────────────────────────────────
let mode = 'mesh';
let torchOn = true;
let facingMode = 'user';
let activeCameraTrack = null;
let inferenceMs = 0;
let fps = 0, fc = 0, ft = performance.now();

// ─── Detection state ──────────────────────────────────────────────────────
let detector = null, detectorReady = false;
let camStream = null;
let rawHands    = []; // latest from GPU detector (async)
let smoothHands = []; // exponentially smoothed, used for render (60fps)
const SMOOTH = 0.45;  // 0=no smoothing 1=frozen; lower = more responsive

function smoothLandmarks(prev, next) {
  if (!prev || prev.length !== next.length) return next.map(l => ({...l}));
  return next.map((lm, i) => ({
    x: prev[i].x + (lm.x - prev[i].x) * (1 - SMOOTH),
    y: prev[i].y + (lm.y - prev[i].y) * (1 - SMOOTH),
    z: prev[i].z + (lm.z - prev[i].z) * (1 - SMOOTH),
  }));
}

// ─── Renderer ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('gl');
const R = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
R.setPixelRatio(Math.min(window.devicePixelRatio, 2));
R.setClearColor(0x000000, 1);
R.shadowMap.enabled = false;
R.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();

// Orthographic camera — landmark coords map directly to screen
const CAM = new THREE.OrthographicCamera(-1,1,1,-1,-10,10);
CAM.position.z = 1;

// ─── Lighting ─────────────────────────────────────────────────────────────
const ambL = new THREE.AmbientLight(0x1a2a3a, 2.5);
scene.add(ambL);

const keyL = new THREE.DirectionalLight(0x88ddff, 1.8);
keyL.position.set(1, 2, 3);
scene.add(keyL);

const rimL = new THREE.DirectionalLight(0x0033aa, 0.8);
rimL.position.set(-2, -1, 1);
scene.add(rimL);

// Torch: PointLight at index fingertip
const torchLight = new THREE.PointLight(0xffc850, 0, 1.5, 2); // intensity 0 = off
torchLight.position.set(0, 0, 0);
scene.add(torchLight);

// Torch glow sprite (lens flare substitute)
const torchGlowGeo = new THREE.SphereGeometry(0.012, 8, 6);
const torchGlowMat = new THREE.MeshBasicMaterial({color:0xffdd88, transparent:true, opacity:0.0});
const torchGlowMesh = new THREE.Mesh(torchGlowGeo, torchGlowMat);
scene.add(torchGlowMesh);

// ─── Low-poly hand ───────────────────────────────────────────────────────

// ─── Materials ────────────────────────────────────────────────────────────
function skinMat() {
  return new THREE.MeshPhongMaterial({
    color: 0x4ab0cc,
    emissive: 0x051a22,
    specular: 0x88ddff,
    shininess: 55,
    flatShading: true,
    transparent: true,
    opacity: 0.93,
    side: THREE.DoubleSide,
  });
}
function lineMat() {
  return new THREE.LineBasicMaterial({color:0x00ffe5, transparent:true, opacity:0.75});
}
function dotMat(tip) {
  return new THREE.MeshPhongMaterial({
    color: tip ? 0xff2255 : 0x00bbaa,
    emissive: tip ? 0x1a000a : 0x001510,
    flatShading: true,
    transparent: true, opacity: tip ? 1.0 : 0.9,
  });
}
function palmMat() {
  return new THREE.MeshPhongMaterial({
    color: 0x38a0bc,
    emissive: 0x041015,
    specular: 0x44bbcc,
    shininess: 35,
    flatShading: true,
    transparent: true,
    opacity: 0.80,
    side: THREE.DoubleSide,
  });
}

// ─── Hand renderer ────────────────────────────────────────────────────────
const UP = new THREE.Vector3(0, 1, 0);

class HandRenderer {
  constructor() {
    this.group = new THREE.Group();
    scene.add(this.group);
    this.group.visible = false;
    this.bones  = [];
    this.joints = [];
    this.lines  = [];
    this.palmMesh = null;
    this._build();
  }

  _build() {
    // 20 bone segments — tapered hex prism per phalanx
    // taper ratios: tip_r / base_r per segment, order matches FINGERS chain
    const TAPER = [
      // thumb: 4 segs
      0.75, 0.80, 0.82, 0.85,
      // index: 4 segs
      0.80, 0.82, 0.84, 0.86,
      // middle: 4 segs
      0.80, 0.82, 0.84, 0.86,
      // ring: 4 segs
      0.80, 0.82, 0.84, 0.86,
      // pinky: 4 segs
      0.78, 0.80, 0.82, 0.85,
    ];
    for (let i = 0; i < 20; i++) {
      const t = TAPER[i] || 0.82;
      // CylinderGeometry(radiusTop, radiusBottom, height, radialSegs)
      const geo = new THREE.CylinderGeometry(t, 1, 1, 6, 1);
      const mesh = new THREE.Mesh(geo, skinMat());
      this.group.add(mesh);
      this.bones.push(mesh);
    }

    // 21 joints — low-poly icosphere
    for (let i = 0; i < 21; i++) {
      const isTip = TIPS.has(i);
      const geo = new THREE.IcosahedronGeometry(1, 1);
      const mesh = new THREE.Mesh(geo, dotMat(isTip));
      this.group.add(mesh);
      this.joints.push(mesh);
    }

    // 23 skeleton lines
    for (let i = 0; i < CONN.length; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0,0,0,0], 3));
      const l = new THREE.Line(geo, lineMat());
      this.group.add(l);
      this.lines.push(l);
    }

    // Palm — 8 triangles as non-indexed (flat shaded facets)
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(8*3*3), 3));
    this.palmMesh = new THREE.Mesh(pg, palmMat());
    this.group.add(this.palmMesh);
  }

  update(lms, aspect, mirrorX) {
    if (!lms || lms.length < 21) { this.group.visible = false; return; }
    this.group.visible = true;

    const pts = lms.map(lm => {
      const nx = mirrorX ? (1 - lm.x) : lm.x;
      return new THREE.Vector3(
        (nx - 0.5) * 2 * aspect,
        -(lm.y - 0.5) * 2,
        -lm.z * 0.6
      );
    });

    const ref   = Math.max(pts[0].distanceTo(pts[9]), 0.01);
    const unitR = ref * 0.09;

    const showMesh = mode === 'mesh';
    const showWire = mode === 'wire';
    const showSkel = mode === 'skel';

    // ── Bones ──
    let bi = 0;
    for (const f of FINGERS) {
      for (let si = 1; si < f.c.length; si++) {
        const bone = this.bones[bi++];
        const a = pts[f.c[si-1]], b = pts[f.c[si]];
        const len = a.distanceTo(b);

        if (len < 0.001) { bone.visible = false; continue; }
        bone.visible = showMesh || showWire;

        // radius tapers from base (r2) to tip (r1)
        const r1 = f.r[si]   * unitR;
        const r2 = f.r[si-1] * unitR;
        // CylinderGeometry has taper baked in (top=t, bottom=1)
        // Scale by base radius r2 so the bottom matches joint width
        bone.scale.set(r2, len, r2);
        bone.position.copy(a).lerp(b, 0.5);

        const dir = new THREE.Vector3().subVectors(b, a).normalize();
        const dot = dir.dot(UP);
        if (Math.abs(dot) > 0.9999) {
          bone.quaternion.set(0, 0, dot < 0 ? 1 : 0, dot < 0 ? 0 : 1).normalize();
        } else {
          bone.quaternion.setFromUnitVectors(UP, dir);
        }

        bone.material.wireframe = showWire;
        bone.material.opacity   = showWire ? 0.55 : 0.93;
      }
    }
    for (let i = bi; i < this.bones.length; i++) this.bones[i].visible = false;

    // ── Joints ──
    for (let i = 0; i < 21; i++) {
      const j = this.joints[i];
      j.visible = showSkel;
      j.position.copy(pts[i]);
      const isTip = TIPS.has(i), isK = KNUCKLES.has(i);
      const r = (isTip ? 1.35 : isK ? 1.15 : 0.9) * unitR;
      j.scale.setScalar(Math.max(r, 0.002));
      j.material.wireframe = false;
    }

    // ── Lines ──
    for (let i = 0; i < CONN.length; i++) {
      const l = this.lines[i];
      const pa = l.geometry.attributes.position.array;
      const a = pts[CONN[i][0]], b = pts[CONN[i][1]];
      pa[0]=a.x; pa[1]=a.y; pa[2]=a.z;
      pa[3]=b.x; pa[4]=b.y; pa[5]=b.z;
      l.geometry.attributes.position.needsUpdate = true;
      l.visible = showSkel || showWire;
    }

    // ── Palm — 8 flat-shaded tris filling the palm area ──
    // Fan from palm centre outward for nice facets
    const ctr = new THREE.Vector3()
      .add(pts[0]).add(pts[5]).add(pts[9]).add(pts[13]).add(pts[17])
      .multiplyScalar(0.2);

    const rim = [pts[1], pts[5], pts[6], pts[9], pts[10], pts[13], pts[14], pts[17], pts[0]];
    const palmTris = [
      [ctr, pts[0],  pts[1] ],
      [ctr, pts[1],  pts[5] ],
      [ctr, pts[5],  pts[9] ],
      [ctr, pts[9],  pts[13]],
      [ctr, pts[13], pts[17]],
      [ctr, pts[17], pts[0] ],
      [pts[5], pts[6],  pts[9] ],
      [pts[9], pts[10], pts[13]],
    ];

    const pa = this.palmMesh.geometry.attributes.position.array;
    palmTris.forEach((tri, ti) => {
      tri.forEach((v, vi) => {
        pa[(ti*3+vi)*3+0] = v.x;
        pa[(ti*3+vi)*3+1] = v.y;
        pa[(ti*3+vi)*3+2] = v.z;
      });
    });
    this.palmMesh.geometry.attributes.position.needsUpdate = true;
    this.palmMesh.geometry.computeVertexNormals();
    this.palmMesh.visible = showMesh;

    return pts[8]; // torch anchor
  }

  hide() { this.group.visible = false; }
}

const HR = [new HandRenderer(), new HandRenderer()];

// ─── Resize ───────────────────────────────────────────────────────────────
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  R.setSize(w, h);
  const a = w/h;
  CAM.left=-a; CAM.right=a; CAM.top=1; CAM.bottom=-1;
  CAM.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ─── Render loop ──────────────────────────────────────────────────────────
// Decouple rendering from MediaPipe inference:
// Three.js runs at display refresh rate (rAF)
// MediaPipe runs as fast as it can separately
// → no frame drops from inference blocking render

let torchPos = new THREE.Vector3();
let torchVisible = false;

function animate() {
  requestAnimationFrame(animate);

  fc++;
  const now = performance.now();
  if (now - ft >= 1000) {
    fps = fc; fc = 0; ft = now;
    document.getElementById('perf').textContent =
      fps + ' fps · ' + inferenceMs.toFixed(0) + ' ms';
  }

  const aspect  = window.innerWidth / window.innerHeight;

  // Smooth raw detector output → silky 60fps hand even at lower inference rate
  if (rawHands.length > 0) {
    smoothHands = rawHands.map((lms, hi) =>
      smoothLandmarks(smoothHands[hi] || null, lms)
    );
    document.getElementById('status').className = 'panel on';
    document.getElementById('stxt').textContent  = 'Tracking';
    document.getElementById('hands').textContent = smoothHands.length + ' hand(s)';
  } else if (smoothHands.length > 0) {
    smoothHands = [];
    document.getElementById('status').className = 'panel';
    document.getElementById('stxt').textContent  = 'Scanning';
    document.getElementById('hands').textContent = '0 hand(s)';
  }
  const mirrorX = (facingMode === 'user');

  torchVisible = false;
  for (let i = 0; i < 2; i++) {
    if (i < smoothHands.length) {
      const tip = HR[i].update(smoothHands[i], aspect, mirrorX);
      if (tip && i === 0) { torchPos.copy(tip); torchVisible = true; }
    } else {
      HR[i].hide();
    }
  }

  // Torch update
  if (torchOn && torchVisible) {
    torchLight.position.copy(torchPos);
    torchLight.intensity = 2.2;
    torchGlowMesh.position.copy(torchPos);
    torchGlowMat.opacity = 0.65;
    document.getElementById('torch-indicator').className = 'on';
  } else {
    torchLight.intensity = 0;
    torchGlowMat.opacity = 0;
    document.getElementById('torch-indicator').className = '';
  }

  R.render(scene, CAM);
}
animate();

const video = document.getElementById('cam');

// ─── TF.js detector init ──────────────────────────────────────────────────
async function initDetector() {
  const lfill = document.getElementById('lfill');
  const ltxt  = document.getElementById('ltxt');
  lfill.style.width = '15%';
  try {
    await tf.setBackend('webgl');
    await tf.ready();
    // Warm up WebGL — avoids first-frame stutter
    tf.tidy(() => tf.zeros([1, 1, 1, 3]).relu());
    lfill.style.width = '50%';
    ltxt.textContent = 'GPU ready…';

    detector = await handPoseDetection.createDetector(
      handPoseDetection.SupportedModels.MediaPipeHands,
      { runtime: 'tfjs', modelType: 'lite', maxHands: 2 }
    );

    lfill.style.width = '100%';
    ltxt.textContent = 'Ready';
    detectorReady = true;
    setTimeout(() => {
      document.getElementById('lbar').style.display = 'none';
      ltxt.style.display = 'none';
      document.getElementById('start-btn').style.display = 'block';
    }, 300);
  } catch(e) {
    ltxt.textContent = 'Error: ' + e.message;
    console.error(e);
  }
}

// ─── Async inference loop (fully decoupled from rAF) ─────────────────────
// rAF renders at 60fps using smoothHands.
// inferenceLoop runs as fast as GPU allows and writes rawHands.
// smoothHands is updated in rAF with exponential lerp — silky even at 20fps inference.
let inferring = false;

async function inferenceLoop() {
  if (!detectorReady || !detector || !video.videoWidth) {
    requestAnimationFrame(inferenceLoop); return;
  }
  if (inferring) { requestAnimationFrame(inferenceLoop); return; }
  inferring = true;
  const t0 = performance.now();
  try {
    const hands = await detector.estimateHands(video, {
      flipHorizontal: facingMode === 'user',
    });
    if (hands && hands.length > 0) {
      rawHands = hands.map(h => {
        const kps  = h.keypoints;
        const kps3 = h.keypoints3D;
        const W = video.videoWidth, H = video.videoHeight;
        return Array.from({length: 21}, (_, i) => ({
          x: kps[i].x / W,
          y: kps[i].y / H,
          z: kps3 ? kps3[i].z / 150 : 0,
        }));
      });
    } else {
      rawHands = [];
    }
  } catch(e) { rawHands = []; }
  inferenceMs = performance.now() - t0;
  inferring = false;
  requestAnimationFrame(inferenceLoop);
}

// ─── Camera ───────────────────────────────────────────────────────────────
async function startCamera(facing) {
  facingMode = facing || 'user';

  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }

  document.getElementById('stxt').textContent = 'Requesting…';
  const ltxt = document.getElementById('ltxt');

  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode,
        width:     { ideal: 1920 },
        height:    { ideal: 1080 },
        frameRate: { ideal: 60 },
      },
      audio: false,
    });
  } catch(err) {
    document.getElementById('stxt').textContent = 'Denied';
    ltxt.textContent = err.name === 'NotAllowedError'
      ? 'Camera denied. Allow in browser settings, then reload.'
      : 'Camera error: ' + err.message;
    ltxt.style.display = 'block';
    const b = document.getElementById('start-btn');
    b.textContent = 'Retry'; b.style.display = 'block';
    return;
  }

  video.srcObject = camStream;
  await new Promise(res => { video.onloadedmetadata = res; });
  await video.play();

  activeCameraTrack = camStream.getVideoTracks()[0] || null;
  applyHardwareTorch(torchOn);

  // Kick off async inference (runs parallel to rAF forever)
  inferenceLoop();

  document.getElementById('splash').style.opacity = '0';
  setTimeout(() => document.getElementById('splash').style.display='none', 500);
  document.getElementById('stxt').textContent = 'Scanning';
}

// ─── UI ───────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => startCamera('user'));

['mesh','wire','skel'].forEach(m => {
  document.getElementById('b'+m[0]).addEventListener('click', () => {
    mode = m;
    ['bm','bw','bs'].forEach(id => document.getElementById(id).classList.remove('on'));
    document.getElementById('b'+m[0]).classList.add('on');
  });
});

// ─── Hardware torch helper ─────────────────────────────────────────────────
async function applyHardwareTorch(on) {
  if (!activeCameraTrack) return;
  try {
    const caps = activeCameraTrack.getCapabilities();
    if (caps && caps.torch) {
      await activeCameraTrack.applyConstraints({ advanced: [{ torch: on }] });
    }
  } catch(e) {
    console.warn('Hardware torch unavailable:', e.message);
  }
}

document.getElementById('bt').addEventListener('click', () => {
  torchOn = !torchOn;
  document.getElementById('bt').classList.toggle('on', torchOn);
  applyHardwareTorch(torchOn);
});

document.getElementById('bc').addEventListener('click', () => {
  const next = facingMode === 'user' ? 'environment' : 'user';
  document.getElementById('bc').textContent = next === 'user' ? '↺ Front' : '↺ Back';
  startCamera(next);
});

// Boot
initDetector();
</script>
</body>
</html>
