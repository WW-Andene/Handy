<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AR Hand 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --plasma: #00ffe5;
    --plasma-dim: rgba(0,255,229,0.15);
    --warn: #ff4060;
    --ui-bg: rgba(8,8,16,0.80);
    --font: 'JetBrains Mono', 'Fira Mono', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: var(--font);
    color: var(--plasma);
  }

  /* Camera video — invisible, detection only */
  #cam {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    width: 1px; height: 1px;
    top: 0; left: 0;
  }

  #gl {
    position: fixed;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    background: #000;
  }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  #status {
    position: absolute;
    top: 16px; left: 16px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--plasma);
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.25);
    border-radius: 4px;
    padding: 6px 10px;
    backdrop-filter: blur(8px);
  }

  #status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--warn);
    margin-right: 6px;
    vertical-align: middle;
    transition: background 0.3s;
  }
  #status.active .dot { background: var(--plasma); }
  #status.active { border-color: rgba(0,255,229,0.5); }

  #fps-counter {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(0,255,229,0.5);
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.1);
    border-radius: 4px;
    padding: 4px 8px;
  }

  #hands-count {
    position: absolute;
    top: 48px; right: 16px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(0,255,229,0.5);
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.1);
    border-radius: 4px;
    padding: 4px 8px;
  }

  #info {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(0,255,229,0.35);
    white-space: nowrap;
  }

  /* Right side controls */
  #controls {
    position: absolute;
    bottom: 60px; right: 16px;
    pointer-events: all;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ctrl-btn {
    background: var(--ui-bg);
    border: 1px solid rgba(0,255,229,0.2);
    color: rgba(0,255,229,0.5);
    font-family: var(--font);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 7px 10px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    text-align: center;
    min-width: 52px;
  }
  .ctrl-btn.active {
    border-color: var(--plasma);
    color: var(--plasma);
    background: rgba(0,255,229,0.1);
  }
  .ctrl-btn:active { transform: scale(0.95); }

  /* Divider between mode and cam switch */
  .ctrl-divider {
    height: 1px;
    background: rgba(0,255,229,0.1);
    margin: 2px 0;
  }

  /* Splash */
  #splash {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: opacity 0.6s;
  }

  #splash h1 {
    font-size: clamp(22px, 6vw, 36px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--plasma);
    text-shadow: 0 0 30px rgba(0,255,229,0.5);
  }

  #splash p {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(0,255,229,0.5);
    text-align: center;
    max-width: 280px;
    line-height: 1.8;
  }

  #start-btn {
    background: transparent;
    border: 1px solid var(--plasma);
    color: var(--plasma);
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 12px 28px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  #start-btn:active { background: var(--plasma-dim); }

  #loading-bar {
    width: 200px; height: 1px;
    background: rgba(0,255,229,0.15);
    border-radius: 1px;
    overflow: hidden;
  }
  #loading-fill {
    height: 100%;
    background: var(--plasma);
    width: 0%;
    transition: width 0.3s;
    box-shadow: 0 0 8px var(--plasma);
  }

  #loading-text {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(0,255,229,0.4);
  }

  /* Scanlines */
  #hud::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
  }
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="status"><span class="dot"></span><span id="status-text">Initializing</span></div>
  <div id="fps-counter">-- fps</div>
  <div id="hands-count">0 hand(s)</div>
  <div id="info">Point hand at camera</div>
  <div id="controls">
    <button class="ctrl-btn active" id="btn-mesh">Mesh</button>
    <button class="ctrl-btn" id="btn-wire">Wire</button>
    <button class="ctrl-btn" id="btn-skel">Skel</button>
    <div class="ctrl-divider"></div>
    <button class="ctrl-btn" id="btn-cam">↺ Cam</button>
  </div>
</div>

<div id="splash">
  <h1>AR Hand 3D</h1>
  <p>3D hand model driven by camera<br>Camera is for detection only</p>
  <div id="loading-bar"><div id="loading-fill"></div></div>
  <div id="loading-text">Loading models…</div>
  <button id="start-btn" style="display:none">Start</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

const FINGERS = [
  { chain: [0,1,2,3,4],    radius: [0.012,0.010,0.009,0.008,0.007] },
  { chain: [0,5,6,7,8],    radius: [0.010,0.010,0.009,0.008,0.007] },
  { chain: [0,9,10,11,12], radius: [0.010,0.011,0.009,0.008,0.007] },
  { chain: [0,13,14,15,16],radius: [0.010,0.010,0.009,0.008,0.007] },
  { chain: [0,17,18,19,20],radius: [0.008,0.008,0.007,0.006,0.005] },
];

let renderMode = 'mesh';
let handsData = [];
let fps = 0, frameCount = 0, lastFpsTime = performance.now();
let facingMode = 'user'; // 'user' = front, 'environment' = back
let mpCamera = null;
let mpReady = false;
let mpHands = null;

// ─────────────────────────────────────────────
//  THREE.JS — pure black background, no video
// ─────────────────────────────────────────────
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1); // solid black
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();

// Perspective camera — gives depth feel to the 3D hand
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.001, 100);
camera.position.set(0, 0, 0.6);

// Subtle ambient + two directional lights
scene.add(new THREE.AmbientLight(0x112233, 1.2));
const keyLight = new THREE.DirectionalLight(0x00ffe5, 1.4);
keyLight.position.set(0.5, 1, 1);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x0055ff, 0.6);
fillLight.position.set(-1, -0.5, 0.3);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
rimLight.position.set(0, 0, -1);
scene.add(rimLight);

// Materials
const meshMat = new THREE.MeshPhongMaterial({
  color: 0x44bbdd,
  emissive: 0x001122,
  specular: 0x00ffe5,
  shininess: 90,
  transparent: true,
  opacity: 0.85,
  side: THREE.DoubleSide,
});

const skelMat = new THREE.LineBasicMaterial({
  color: 0x00ffe5,
  transparent: true,
  opacity: 0.95,
});

const jointMat = new THREE.MeshBasicMaterial({
  color: 0x00ffe5,
  transparent: true,
  opacity: 0.9,
});

const tipMat = new THREE.MeshBasicMaterial({
  color: 0xff4060,
  transparent: true,
  opacity: 1.0,
});

// ─────────────────────────────────────────────
//  HAND RENDERER
// ─────────────────────────────────────────────
class HandRenderer {
  constructor() {
    this.group = new THREE.Group();
    scene.add(this.group);
    this.group.visible = false;
    this.bones = [];
    this.joints = [];
    this.lines = [];
    this.palmMesh = null;
    this._build();
  }

  _build() {
    for (let i = 0; i < 20; i++) {
      const geo = new THREE.CylinderGeometry(1, 1, 1, 8);
      const m = new THREE.Mesh(geo, meshMat.clone());
      this.group.add(m);
      this.bones.push(m);
    }
    for (let i = 0; i < 21; i++) {
      const isTip = [4,8,12,16,20].includes(i);
      const geo = new THREE.SphereGeometry(1, 8, 6);
      const m = new THREE.Mesh(geo, (isTip ? tipMat : jointMat).clone());
      this.group.add(m);
      this.joints.push(m);
    }
    for (let i = 0; i < CONNECTIONS.length; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0,0,0,0], 3));
      const l = new THREE.Line(geo, skelMat.clone());
      this.group.add(l);
      this.lines.push(l);
    }
    // Palm: 5 triangles
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(5*3*3), 3));
    this.palmMesh = new THREE.Mesh(pg, meshMat.clone());
    this.group.add(this.palmMesh);
  }

  update(landmarks, mode, mirrorX) {
    if (!landmarks) { this.group.visible = false; return; }
    this.group.visible = true;

    // Convert MediaPipe normalized coords → scene coords
    // mirrorX: front cam needs flip, back cam doesn't
    const aspect = window.innerWidth / window.innerHeight;
    const pts = landmarks.map(lm => {
      const x = mirrorX ? (1 - lm.x - 0.5) : (lm.x - 0.5);
      return new THREE.Vector3(
        x * aspect,                // scale X by aspect
        -(lm.y - 0.5),             // flip Y (screen Y down → scene Y up)
        -lm.z * 0.4                // Z depth
      );
    });

    const wristToMid = pts[0].distanceTo(pts[9]);
    const bScale = Math.max(wristToMid * 0.13, 0.004);

    const showMesh = mode === 'mesh';
    const showWire = mode === 'wire';
    const showSkel = mode === 'skel';

    // Bones
    let bi = 0;
    FINGERS.forEach(finger => {
      finger.chain.forEach((lmIdx, si) => {
        if (si === 0) return;
        const bone = this.bones[bi++];
        if (!bone) return;
        const a = pts[finger.chain[si-1]];
        const b = pts[lmIdx];
        const mid = new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
        const len = a.distanceTo(b);
        const r = finger.radius[si] * (wristToMid / 0.12);
        bone.position.copy(mid);
        bone.scale.set(r, len, r);
        const dir = new THREE.Vector3().subVectors(b,a).normalize();
        bone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
        bone.visible = showMesh || showWire;
        bone.material.wireframe = showWire;
        bone.material.opacity = showWire ? 0.9 : 0.85;
      });
    });
    for (let i = bi; i < this.bones.length; i++) this.bones[i].visible = false;

    // Joints
    pts.forEach((pt, i) => {
      const j = this.joints[i];
      if (!j) return;
      j.position.copy(pt);
      const isTip = [4,8,12,16,20].includes(i);
      const r = (isTip ? bScale * 1.5 : bScale) * (wristToMid / 0.12);
      j.scale.setScalar(r);
      j.visible = showMesh || showSkel;
    });

    // Lines
    CONNECTIONS.forEach((conn, i) => {
      const line = this.lines[i];
      const pa = line.geometry.attributes.position.array;
      const a = pts[conn[0]], b = pts[conn[1]];
      pa[0]=a.x; pa[1]=a.y; pa[2]=a.z;
      pa[3]=b.x; pa[4]=b.y; pa[5]=b.z;
      line.geometry.attributes.position.needsUpdate = true;
      line.visible = showSkel || showWire;
    });

    // Palm
    const tris = [
      [pts[0], pts[5],  pts[9]],
      [pts[0], pts[9],  pts[13]],
      [pts[0], pts[13], pts[17]],
      [pts[0], pts[1],  pts[5]],
      [pts[0], pts[17], pts[16]],
    ];
    const pa = this.palmMesh.geometry.attributes.position.array;
    tris.forEach((tri, ti) => tri.forEach((v, vi) => {
      pa[(ti*3+vi)*3+0] = v.x;
      pa[(ti*3+vi)*3+1] = v.y;
      pa[(ti*3+vi)*3+2] = v.z;
    }));
    this.palmMesh.geometry.attributes.position.needsUpdate = true;
    this.palmMesh.geometry.computeVertexNormals();
    this.palmMesh.visible = showMesh;
    this.palmMesh.material.wireframe = false;
    this.palmMesh.material.opacity = 0.5;
  }

  hide() { this.group.visible = false; }
}

const handRenderers = [new HandRenderer(), new HandRenderer()];

// ─────────────────────────────────────────────
//  RESIZE
// ─────────────────────────────────────────────
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// ─────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fps = frameCount; frameCount = 0; lastFpsTime = now;
    document.getElementById('fps-counter').textContent = fps + ' fps';
  }

  // Mirror X for front cam, no mirror for back cam
  const mirrorX = (facingMode === 'user');

  for (let i = 0; i < 2; i++) {
    if (i < handsData.length) handRenderers[i].update(handsData[i], renderMode, mirrorX);
    else handRenderers[i].hide();
  }

  renderer.render(scene, camera);
}
animate();

// ─────────────────────────────────────────────
//  MEDIAPIPE
// ─────────────────────────────────────────────
function initMediaPipe() {
  const loadFill = document.getElementById('loading-fill');
  const loadText = document.getElementById('loading-text');
  loadFill.style.width = '20%';

  mpHands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
  });
  mpHands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.55,
  });
  mpHands.onResults(results => {
    handsData = results.multiHandLandmarks || [];
    const statusEl = document.getElementById('status');
    document.getElementById('status-text').textContent = handsData.length ? 'Tracking' : 'Scanning';
    statusEl.className = handsData.length ? 'active' : '';
    document.getElementById('hands-count').textContent = handsData.length + ' hand(s)';
  });

  let prog = 20;
  const iv = setInterval(() => {
    prog = Math.min(prog + 8, 90);
    loadFill.style.width = prog + '%';
    if (prog >= 90) clearInterval(iv);
  }, 300);

  mpHands.initialize().then(() => {
    mpReady = true;
    loadFill.style.width = '100%';
    loadText.textContent = 'Ready';
    setTimeout(() => {
      document.getElementById('loading-bar').style.display = 'none';
      document.getElementById('loading-text').style.display = 'none';
      document.getElementById('start-btn').style.display = 'block';
    }, 400);
  }).catch(err => {
    loadText.textContent = 'Error: ' + err.message;
  });
}

// ─────────────────────────────────────────────
//  CAMERA
// ─────────────────────────────────────────────
const video = document.getElementById('cam');

async function startCamera(facing) {
  facingMode = facing || 'user';

  // Stop existing camera
  if (mpCamera) {
    try { await mpCamera.stop(); } catch(e) {}
    mpCamera = null;
  }

  document.getElementById('status-text').textContent = 'Requesting permission…';
  const loadText = document.getElementById('loading-text');

  // Explicit getUserMedia to trigger permission prompt
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
  } catch (err) {
    document.getElementById('status-text').textContent = 'Denied';
    loadText.textContent = err.name === 'NotAllowedError'
      ? 'Camera access denied. Allow in browser settings and reload.'
      : 'Camera error: ' + err.message;
    loadText.style.display = 'block';
    const btn = document.getElementById('start-btn');
    btn.textContent = 'Retry';
    btn.style.display = 'block';
    return;
  }
  stream.getTracks().forEach(t => t.stop()); // release — MediaPipe opens its own

  document.getElementById('status-text').textContent = 'Starting…';

  try {
    mpCamera = new Camera(video, {
      onFrame: async () => {
        if (mpReady && mpHands) await mpHands.send({ image: video });
      },
      width: 1280,
      height: 720,
      facingMode: facingMode,
    });
    await mpCamera.start();

    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => document.getElementById('splash').style.display = 'none', 600);
    document.getElementById('status-text').textContent = 'Scanning';
  } catch (err) {
    document.getElementById('status-text').textContent = 'Error';
    loadText.textContent = 'Failed: ' + err.message;
    loadText.style.display = 'block';
  }
}

// ─────────────────────────────────────────────
//  UI
// ─────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => startCamera('user'));

document.getElementById('btn-mesh').addEventListener('click', () => setMode('mesh'));
document.getElementById('btn-wire').addEventListener('click', () => setMode('wire'));
document.getElementById('btn-skel').addEventListener('click', () => setMode('skel'));

document.getElementById('btn-cam').addEventListener('click', () => {
  const next = facingMode === 'user' ? 'environment' : 'user';
  document.getElementById('btn-cam').textContent = next === 'user' ? '↺ Front' : '↺ Back';
  startCamera(next);
});

function setMode(mode) {
  renderMode = mode;
  document.querySelectorAll('.ctrl-btn').forEach(b => {
    if (['btn-mesh','btn-wire','btn-skel'].includes(b.id)) b.classList.remove('active');
  });
  document.getElementById('btn-' + mode).classList.add('active');
}

// Boot
initMediaPipe();
</script>
</body>
</html>
